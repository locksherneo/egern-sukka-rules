name: Sukka List to Egern V1.1 Final

on:
  workflow_dispatch:

  schedule:
    # 每天 UTC 06:20 自动同步一次
    # 圣保罗通常为 03:20
    - cron: "20 6 * * *"

permissions:
  contents: write

concurrency:
  group: sukka-egern-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SOURCE_BASE: https://ruleset.skk.moe
      MIN_TOTAL_RULES: 20

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. 配置 Git
      # ==========================================================

      - name: Configure Git
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # ==========================================================
      # 3. 准备临时目录
      # ==========================================================

      - name: Prepare workspace
        run: |
          set -euo pipefail

          rm -rf /tmp/sukka-egern

          mkdir -p /tmp/sukka-egern/source/domainset
          mkdir -p /tmp/sukka-egern/source/non_ip
          mkdir -p /tmp/sukka-egern/source/ip

          mkdir -p /tmp/sukka-egern/output/domain
          mkdir -p /tmp/sukka-egern/output/non_ip
          mkdir -p /tmp/sukka-egern/output/ip


      # ==========================================================
      # 4. 获取 Sukka 首页
      # ==========================================================

      - name: Fetch Sukka index
        run: |
          set -euo pipefail

          echo "Fetching Sukka index..."

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            "${SOURCE_BASE}/" \
            -o /tmp/sukka-egern/index.html

          if [ ! -s /tmp/sukka-egern/index.html ]; then
            echo "ERROR: Sukka index is empty."
            exit 1
          fi

          SIZE=$(wc -c < /tmp/sukka-egern/index.html)

          echo "Index size: ${SIZE} bytes"

          if [ "${SIZE}" -lt 500 ]; then
            echo "ERROR: Sukka index looks abnormal."
            exit 1
          fi


      # ==========================================================
      # 5. 自动发现 List/*.conf
      # ==========================================================

      - name: Discover Sukka List rules
        run: |
          set -euo pipefail

          grep -oE \
            'List/(domainset|non_ip|ip)/[^"<> ]+\.conf' \
            /tmp/sukka-egern/index.html \
            | sort -u \
            > /tmp/sukka-egern/files.txt

          TOTAL=$(wc -l < /tmp/sukka-egern/files.txt)

          DOMAINSET=$(
            grep -c '^List/domainset/' \
            /tmp/sukka-egern/files.txt || true
          )

          NON_IP=$(
            grep -c '^List/non_ip/' \
            /tmp/sukka-egern/files.txt || true
          )

          IP=$(
            grep -c '^List/ip/' \
            /tmp/sukka-egern/files.txt || true
          )

          echo ""
          echo "===================================="
          echo " Sukka List Rules"
          echo "===================================="
          echo " domainset : ${DOMAINSET}"
          echo " non_ip    : ${NON_IP}"
          echo " ip        : ${IP}"
          echo "------------------------------------"
          echo " TOTAL     : ${TOTAL}"
          echo "===================================="

          if [ "${TOTAL}" -lt "${MIN_TOTAL_RULES}" ]; then
            echo "ERROR: Too few List rules discovered."
            exit 1
          fi

          if [ "${DOMAINSET}" -eq 0 ] || \
             [ "${NON_IP}" -eq 0 ] || \
             [ "${IP}" -eq 0 ]; then

            echo "ERROR: One or more List categories are missing."
            exit 1
          fi


      # ==========================================================
      # 6. 下载 List 规则
      # ==========================================================

      - name: Download Sukka List rules
        run: |
          set -euo pipefail

          SUCCESS=0

          while IFS= read -r FILE; do

            [ -z "${FILE}" ] && continue

            RELATIVE="${FILE#List/}"

            DEST="/tmp/sukka-egern/source/${RELATIVE}"

            mkdir -p "$(dirname "${DEST}")"

            echo "↓ ${FILE}"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 120 \
              "${SOURCE_BASE}/${FILE}" \
              -o "${DEST}"

            if [ ! -s "${DEST}" ]; then
              echo "ERROR: Empty source file:"
              echo "${FILE}"
              exit 1
            fi

            SUCCESS=$((SUCCESS + 1))

          done < /tmp/sukka-egern/files.txt

          echo ""
          echo "Downloaded ${SUCCESS} source files."


      # ==========================================================
      # 7. 转换 Sukka List → Egern YAML
      # ==========================================================

      - name: Convert List rules to Egern
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from collections import OrderedDict

          SOURCE_ROOT = Path("/tmp/sukka-egern/source")
          OUTPUT_ROOT = Path("/tmp/sukka-egern/output")

          TYPE_MAP = {
              "DOMAIN": "domain_set",
              "DOMAIN-SUFFIX": "domain_suffix_set",
              "DOMAIN-KEYWORD": "domain_keyword_set",
              "DOMAIN-REGEX": "domain_regex_set",
              "DOMAIN-WILDCARD": "domain_wildcard_set",

              "IP-CIDR": "ip_cidr_set",
              "IP-CIDR6": "ip_cidr6_set",
              "IP-ASN": "asn_set",
              "ASN": "asn_set",
              "GEOIP": "geoip_set",

              "URL-REGEX": "url_regex_set",
              "USER-AGENT": "user_agent_set",
              "DEST-PORT": "dest_port_set",
              "DST-PORT": "dest_port_set",
              "PROTOCOL": "protocol_set",
          }

          OUTPUT_ORDER = [
              "domain_set",
              "domain_suffix_set",
              "domain_keyword_set",
              "domain_regex_set",
              "domain_wildcard_set",

              "ip_cidr_set",
              "ip_cidr6_set",
              "asn_set",
              "geoip_set",

              "url_regex_set",
              "user_agent_set",
              "dest_port_set",
              "protocol_set",
          ]

          stats = {
              "generated": 0,
              "deprecated": 0,
              "empty": 0,
              "unsupported": 0,
          }

          skipped_files = []
          unsupported_rules = []


          def yaml_quote(value: str) -> str:
              value = value.strip()

              if not value:
                  return '""'

              needs_quote = (
                  ":" in value
                  or "#" in value
                  or "\\" in value
                  or '"' in value
                  or value.startswith(
                      ("*", "&", "!", "{", "[", "-", "?", "@", "`")
                  )
                  or value.lower() in {
                      "true",
                      "false",
                      "null",
                      "yes",
                      "no",
                      "on",
                      "off",
                  }
              )

              if needs_quote:
                  value = (
                      value
                      .replace("\\", "\\\\")
                      .replace('"', '\\"')
                  )

                  return f'"{value}"'

              return value


          def add_value(groups, key, value):
              value = value.strip()

              if not value:
                  return

              if key not in groups:
                  groups[key] = []

              if value not in groups[key]:
                  groups[key].append(value)


          def is_deprecated(text: str) -> bool:
              lower = text.lower()

              return (
                  "deprecated" in lower
                  or "has been merged with" in lower
                  or "has been merged into" in lower
              )


          def write_yaml(dst: Path, groups) -> bool:

              has_rules = any(
                  groups.get(key)
                  for key in OUTPUT_ORDER
              )

              if not has_rules:
                  return False

              dst.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              with dst.open(
                  "w",
                  encoding="utf-8"
              ) as f:

                  for key in OUTPUT_ORDER:

                      values = groups.get(key)

                      if not values:
                          continue

                      f.write(f"{key}:\n")

                      for value in values:
                          f.write(
                              f"  - {yaml_quote(value)}\n"
                          )

              return True


          # ======================================================
          # domainset 转换
          # ======================================================

          def convert_domainset(src: Path, dst: Path):

              text = src.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              if is_deprecated(text):

                  stats["deprecated"] += 1

                  skipped_files.append(
                      f"DEPRECATED: {src.name}"
                  )

                  return

              groups = OrderedDict()

              for raw in text.splitlines():

                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  # Sukka domainset 格式：
                  #
                  # example.com
                  # .example.com
                  #
                  # 前导 "." 转 domain_suffix_set
                  #
                  if line.startswith("."):

                      add_value(
                          groups,
                          "domain_suffix_set",
                          line[1:]
                      )

                  else:

                      add_value(
                          groups,
                          "domain_set",
                          line
                      )

              if write_yaml(dst, groups):

                  stats["generated"] += 1

              else:

                  stats["empty"] += 1

                  skipped_files.append(
                      f"EMPTY: {src.name}"
                  )


          # ======================================================
          # non_ip / ip 通用规则转换
          # ======================================================

          def convert_standard(src: Path, dst: Path):

              text = src.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              if is_deprecated(text):

                  stats["deprecated"] += 1

                  skipped_files.append(
                      f"DEPRECATED: {src.name}"
                  )

                  return

              groups = OrderedDict()

              for raw in text.splitlines():

                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  parts = [
                      item.strip()
                      for item in line.split(",")
                  ]

                  if len(parts) < 2:

                      stats["unsupported"] += 1

                      unsupported_rules.append(
                          f"{src.name}: {line}"
                      )

                      continue

                  rule_type = parts[0].upper()

                  value = parts[1]

                  field = TYPE_MAP.get(rule_type)

                  if not field:

                      stats["unsupported"] += 1

                      unsupported_rules.append(
                          f"{src.name}: {line}"
                      )

                      continue

                  add_value(
                      groups,
                      field,
                      value
                  )

              if write_yaml(dst, groups):

                  stats["generated"] += 1

              else:

                  stats["empty"] += 1

                  skipped_files.append(
                      f"EMPTY: {src.name}"
                  )


          # ======================================================
          # domainset
          # ======================================================

          for src in sorted(
              (SOURCE_ROOT / "domainset").glob("*.conf")
          ):

              dst = (
                  OUTPUT_ROOT
                  / "domain"
                  / f"{src.stem}.yaml"
              )

              convert_domainset(
                  src,
                  dst
              )


          # ======================================================
          # non_ip
          # ======================================================

          for src in sorted(
              (SOURCE_ROOT / "non_ip").glob("*.conf")
          ):

              dst = (
                  OUTPUT_ROOT
                  / "non_ip"
                  / f"{src.stem}.yaml"
              )

              convert_standard(
                  src,
                  dst
              )


          # ======================================================
          # ip
          # ======================================================

          for src in sorted(
              (SOURCE_ROOT / "ip").glob("*.conf")
          ):

              dst = (
                  OUTPUT_ROOT
                  / "ip"
                  / f"{src.stem}.yaml"
              )

              convert_standard(
                  src,
                  dst
              )


          # ======================================================
          # 输出统计
          # ======================================================

          print("")
          print("====================================")
          print(" Sukka → Egern Conversion")
          print("====================================")

          print(
              f" Generated   : "
              f"{stats['generated']}"
          )

          print(
              f" Deprecated  : "
              f"{stats['deprecated']}"
          )

          print(
              f" Empty       : "
              f"{stats['empty']}"
          )

          print(
              f" Unsupported : "
              f"{stats['unsupported']}"
          )

          print("====================================")


          # ======================================================
          # 保存跳过报告
          # ======================================================

          if skipped_files:

              Path(
                  "/tmp/sukka-egern/skipped.txt"
              ).write_text(
                  "\n".join(skipped_files),
                  encoding="utf-8"
              )

              print("")
              print("Skipped source files:")

              for item in skipped_files:
                  print(f"  {item}")


          # ======================================================
          # 保存 unsupported 报告
          # ======================================================

          if unsupported_rules:

              Path(
                  "/tmp/sukka-egern/unsupported.txt"
              ).write_text(
                  "\n".join(unsupported_rules),
                  encoding="utf-8"
              )

              print("")
              print(
                  f"Unsupported rule lines: "
                  f"{len(unsupported_rules)}"
              )

              for item in unsupported_rules[:30]:
                  print(f"  {item}")

              if len(unsupported_rules) > 30:

                  print(
                      "  ... more unsupported rules omitted "
                      "from workflow log"
                  )


          if stats["generated"] == 0:

              raise SystemExit(
                  "ERROR: No Egern rules generated."
              )

          PY


      # ==========================================================
      # 8. 验证转换结果
      # ==========================================================

      - name: Validate Egern output
        run: |
          set -euo pipefail

          DOMAIN=$(
            find /tmp/sukka-egern/output/domain \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          NON_IP=$(
            find /tmp/sukka-egern/output/non_ip \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          IP=$(
            find /tmp/sukka-egern/output/ip \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          TOTAL=$((DOMAIN + NON_IP + IP))

          echo ""
          echo "===================================="
          echo " Egern Rule Sets"
          echo "===================================="
          echo " domain : ${DOMAIN}"
          echo " non_ip : ${NON_IP}"
          echo " ip     : ${IP}"
          echo "------------------------------------"
          echo " TOTAL  : ${TOTAL}"
          echo "===================================="

          if [ "${TOTAL}" -lt "${MIN_TOTAL_RULES}" ]; then
            echo "ERROR: Too few Egern rule sets."
            exit 1
          fi

          if [ "${DOMAIN}" -eq 0 ] || \
             [ "${NON_IP}" -eq 0 ] || \
             [ "${IP}" -eq 0 ]; then

            echo "ERROR: One or more output categories are missing."

            exit 1
          fi

          EMPTY=0

          while IFS= read -r FILE; do

            if [ ! -s "${FILE}" ]; then

              echo "ERROR: Empty generated YAML:"
              echo "${FILE}"

              EMPTY=$((EMPTY + 1))

            fi

          done < <(
            find /tmp/sukka-egern/output \
              -type f \
              -name "*.yaml"
          )

          if [ "${EMPTY}" -ne 0 ]; then
            exit 1
          fi

          echo ""
          echo "Egern output validation passed."


      # ==========================================================
      # 9. 安装 YAML validator
      # ==========================================================

      - name: Install YAML validator
        run: |
          set -euo pipefail

          python3 -m pip install \
            --quiet \
            pyyaml


      # ==========================================================
      # 10. YAML 语法解析验证
      # ==========================================================

      - name: Parse Egern YAML
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import yaml

          ROOT = Path(
              "/tmp/sukka-egern/output"
          )

          allowed_keys = {
              "domain_set",
              "domain_suffix_set",
              "domain_keyword_set",
              "domain_regex_set",
              "domain_wildcard_set",
              "ip_cidr_set",
              "ip_cidr6_set",
              "asn_set",
              "geoip_set",
              "url_regex_set",
              "user_agent_set",
              "dest_port_set",
              "protocol_set",
          }

          count = 0

          for file in sorted(
              ROOT.rglob("*.yaml")
          ):

              with file.open(
                  "r",
                  encoding="utf-8"
              ) as f:

                  data = yaml.safe_load(f)

              if not isinstance(data, dict):

                  raise RuntimeError(
                      f"Invalid Egern YAML: {file}"
                  )

              unknown = (
                  set(data.keys())
                  - allowed_keys
              )

              if unknown:

                  raise RuntimeError(
                      f"Unknown Egern keys "
                      f"in {file}: {unknown}"
                  )

              for key, value in data.items():

                  if not isinstance(value, list):

                      raise RuntimeError(
                          f"{file}: "
                          f"{key} is not a list"
                      )

                  if not value:

                      raise RuntimeError(
                          f"{file}: "
                          f"{key} is empty"
                      )

              count += 1

          print(
              f"Validated {count} Egern YAML files."
          )

          PY


      # ==========================================================
      # 11. 生成转换报告
      # ==========================================================

      - name: Generate conversion report
        run: |
          set -euo pipefail

          {
            echo "# Sukka → Egern Conversion Report"
            echo ""
            echo "Source:"
            echo ""
            echo "https://ruleset.skk.moe/"
            echo ""
            echo "## Skipped files"
            echo ""

            if [ -s /tmp/sukka-egern/skipped.txt ]; then
              sed 's/^/- /' \
                /tmp/sukka-egern/skipped.txt
            else
              echo "- None"
            fi

            echo ""
            echo "## Unsupported rule lines"
            echo ""

            if [ -s /tmp/sukka-egern/unsupported.txt ]; then
              echo '```text'
              cat /tmp/sukka-egern/unsupported.txt
              echo '```'
            else
              echo "None"
            fi

          } > /tmp/sukka-egern/REPORT.md


      # ==========================================================
      # 12. 计算新规则 SHA256
      # ==========================================================

      - name: Generate new checksum
        run: |
          set -euo pipefail

          cd /tmp/sukka-egern/output

          find domain non_ip ip \
            -type f \
            -name "*.yaml" \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/sukka-egern/new.sha256

          sha256sum \
            /tmp/sukka-egern/new.sha256 \
            | awk '{print $1}' \
            > /tmp/sukka-egern/new.master

          echo "New rule version:"

          cat /tmp/sukka-egern/new.master


      # ==========================================================
      # 13. 计算当前仓库规则 SHA256
      # ==========================================================

      - name: Generate current checksum
        run: |
          set -euo pipefail

          if [ -d domain ] && \
             [ -d non_ip ] && \
             [ -d ip ] && \
             find domain non_ip ip \
               -type f \
               -name "*.yaml" \
               | grep -q .; then

            find domain non_ip ip \
              -type f \
              -name "*.yaml" \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > /tmp/sukka-egern/current.sha256

            sha256sum \
              /tmp/sukka-egern/current.sha256 \
              | awk '{print $1}' \
              > /tmp/sukka-egern/current.master

          else

            echo "none" \
              > /tmp/sukka-egern/current.master

          fi

          echo "Current rule version:"

          cat /tmp/sukka-egern/current.master


      # ==========================================================
      # 14. 比较是否变化
      # ==========================================================

      - name: Compare rule versions
        id: compare
        run: |
          set -euo pipefail

          NEW=$(
            cat /tmp/sukka-egern/new.master
          )

          OLD=$(
            cat /tmp/sukka-egern/current.master
          )

          echo "Old: ${OLD}"
          echo "New: ${NEW}"

          if [ "${NEW}" = "${OLD}" ]; then

            echo "changed=false" \
              >> "$GITHUB_OUTPUT"

            echo "Rules are already up to date."

          else

            echo "changed=true" \
              >> "$GITHUB_OUTPUT"

            echo "Rule update detected."

          fi


      # ==========================================================
      # 15. 无变化
      # ==========================================================

      - name: No update required
        if: steps.compare.outputs.changed == 'false'
        run: |
          echo ""
          echo "===================================="
          echo " Sukka List → Egern V1.1"
          echo "===================================="
          echo " STATUS : UP TO DATE"
          echo " COMMIT : NO"
          echo "===================================="


      # ==========================================================
      # 16. 替换正式目录
      # ==========================================================

      - name: Replace Egern rules
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          rm -rf domain.new
          rm -rf non_ip.new
          rm -rf ip.new

          cp -a \
            /tmp/sukka-egern/output/domain \
            domain.new

          cp -a \
            /tmp/sukka-egern/output/non_ip \
            non_ip.new

          cp -a \
            /tmp/sukka-egern/output/ip \
            ip.new

          NEW_DOMAIN=$(
            find domain.new \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          NEW_NON_IP=$(
            find non_ip.new \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          NEW_IP=$(
            find ip.new \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          TOTAL=$(
            (
              NEW_DOMAIN
              + NEW_NON_IP
              + NEW_IP
            )
          )

          if [ "${TOTAL}" \
            -lt "${MIN_TOTAL_RULES}" ]; then

            echo "ERROR:"
            echo "Pre-replacement validation failed."

            exit 1
          fi

          rm -rf domain non_ip ip

          mv domain.new domain
          mv non_ip.new non_ip
          mv ip.new ip


      # ==========================================================
      # 17. 保存 SHA256
      # ==========================================================

      - name: Save checksums
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          cp \
            /tmp/sukka-egern/new.sha256 \
            RULES_SHA256SUMS.txt

          cp \
            /tmp/sukka-egern/new.master \
            RULES_VERSION.sha256


      # ==========================================================
      # 18. 保存转换报告
      # ==========================================================

      - name: Save conversion report
        if: steps.compare.outputs.changed == 'true'
        run: |
          cp \
            /tmp/sukka-egern/REPORT.md \
            CONVERSION_REPORT.md


      # ==========================================================
      # 19. README
      # ==========================================================

      - name: Update README
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          DOMAIN=$(
            find domain \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          NON_IP=$(
            find non_ip \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          IP=$(
            find ip \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          TOTAL=$(
            (
              DOMAIN
              + NON_IP
              + IP
            )
          )

          VERSION=$(
            cat RULES_VERSION.sha256
          )

          cat > README.md <<EOF
          # Sukka Rules for Egern

          自动将 Sukka Ruleset Server 的通用 List 规则转换为 Egern Rule Set。

          ## Upstream

          https://ruleset.skk.moe/

          ## Source

          \`\`\`text
          List/domainset
          List/non_ip
          List/ip
          \`\`\`

          ## Output

          \`\`\`text
          domain/
          non_ip/
          ip/
          \`\`\`

          ## Rule Count

          | Type | Count |
          |---|---:|
          | domain | ${DOMAIN} |
          | non_ip | ${NON_IP} |
          | ip | ${IP} |
          | Total | ${TOTAL} |

          ## Current Version

          \`\`\`
          ${VERSION}
          \`\`\`

          ## Example Raw URLs

          \`\`\`
