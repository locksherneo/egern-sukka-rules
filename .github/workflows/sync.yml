name: Sukka List to Egern V1.1.3 no_resolve Fix

on:
  workflow_dispatch:

  schedule:
    # 每 24 小时检查一次
    # UTC 06:20
    - cron: "20 6 * * *"

permissions:
  contents: write

concurrency:
  group: sukka-egern-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SOURCE_BASE: https://ruleset.skk.moe
      MIN_TOTAL_RULES: 20

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. Configure Git
      # ==========================================================

      - name: Configure Git
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # ==========================================================
      # 3. Prepare workspace
      # ==========================================================

      - name: Prepare workspace
        run: |
          set -euo pipefail

          rm -rf /tmp/sukka-egern

          mkdir -p /tmp/sukka-egern/source/domainset
          mkdir -p /tmp/sukka-egern/source/non_ip
          mkdir -p /tmp/sukka-egern/source/ip

          mkdir -p /tmp/sukka-egern/output/domain
          mkdir -p /tmp/sukka-egern/output/non_ip
          mkdir -p /tmp/sukka-egern/output/ip


      # ==========================================================
      # 4. Fetch Sukka index
      # ==========================================================

      - name: Fetch Sukka index
        run: |
          set -euo pipefail

          echo "Fetching Sukka index..."

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            "${SOURCE_BASE}/" \
            -o /tmp/sukka-egern/index.html

          if [ ! -s /tmp/sukka-egern/index.html ]; then
            echo "ERROR: Sukka index is empty."
            exit 1
          fi

          SIZE=$(wc -c < /tmp/sukka-egern/index.html)

          echo "Index size: ${SIZE} bytes"

          if [ "${SIZE}" -lt 500 ]; then
            echo "ERROR: Sukka index looks abnormal."
            exit 1
          fi


      # ==========================================================
      # 5. Discover Sukka List rules
      # ==========================================================

      - name: Discover Sukka List rules
        run: |
          set -euo pipefail

          grep -oE \
            'List/(domainset|non_ip|ip)/[^"<> ]+\.conf' \
            /tmp/sukka-egern/index.html \
            | sort -u \
            > /tmp/sukka-egern/files.txt

          TOTAL=$(wc -l < /tmp/sukka-egern/files.txt)

          DOMAINSET=$(
            grep -c '^List/domainset/' \
            /tmp/sukka-egern/files.txt || true
          )

          NON_IP=$(
            grep -c '^List/non_ip/' \
            /tmp/sukka-egern/files.txt || true
          )

          IP=$(
            grep -c '^List/ip/' \
            /tmp/sukka-egern/files.txt || true
          )

          echo ""
          echo "===================================="
          echo " Sukka List Rules"
          echo "===================================="
          echo " domainset : ${DOMAINSET}"
          echo " non_ip    : ${NON_IP}"
          echo " ip        : ${IP}"
          echo "------------------------------------"
          echo " TOTAL     : ${TOTAL}"
          echo "===================================="

          if [ "${TOTAL}" -lt "${MIN_TOTAL_RULES}" ]; then
            echo "ERROR: Too few List rules discovered."
            exit 1
          fi

          if [ "${DOMAINSET}" -eq 0 ] || \
             [ "${NON_IP}" -eq 0 ] || \
             [ "${IP}" -eq 0 ]; then

            echo "ERROR: Missing List category."
            exit 1
          fi


      # ==========================================================
      # 6. Download Sukka List rules
      # ==========================================================

      - name: Download Sukka List rules
        run: |
          set -euo pipefail

          SUCCESS=0

          while IFS= read -r FILE; do

            [ -z "${FILE}" ] && continue

            RELATIVE="${FILE#List/}"

            DEST="/tmp/sukka-egern/source/${RELATIVE}"

            mkdir -p "$(dirname "${DEST}")"

            echo "↓ ${FILE}"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 120 \
              "${SOURCE_BASE}/${FILE}" \
              -o "${DEST}"

            if [ ! -s "${DEST}" ]; then
              echo "ERROR: Empty source file:"
              echo "${FILE}"
              exit 1
            fi

            SUCCESS=$((SUCCESS + 1))

          done < /tmp/sukka-egern/files.txt

          echo ""
          echo "Downloaded ${SUCCESS} source files."


      # ==========================================================
      # 7. Convert Sukka List -> Egern
      #
      # V1.1.3:
      # - 保留 no-resolve 语义
      # - 文件内任一支持的 IP 规则带 no-resolve
      #   => Egern 顶层 no_resolve: true
      # ==========================================================

      - name: Convert List rules to Egern
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from collections import OrderedDict
          import json

          SOURCE_ROOT = Path("/tmp/sukka-egern/source")
          OUTPUT_ROOT = Path("/tmp/sukka-egern/output")

          TYPE_MAP = {
              "DOMAIN": "domain_set",
              "DOMAIN-SUFFIX": "domain_suffix_set",
              "DOMAIN-KEYWORD": "domain_keyword_set",
              "DOMAIN-REGEX": "domain_regex_set",
              "DOMAIN-WILDCARD": "domain_wildcard_set",

              "IP-CIDR": "ip_cidr_set",
              "IP-CIDR6": "ip_cidr6_set",
              "IP-ASN": "asn_set",
              "ASN": "asn_set",
              "GEOIP": "geoip_set",

              "URL-REGEX": "url_regex_set",
              "USER-AGENT": "user_agent_set",
              "DEST-PORT": "dest_port_set",
              "DST-PORT": "dest_port_set",
              "PROTOCOL": "protocol_set",
          }

          OUTPUT_ORDER = [
              "domain_set",
              "domain_suffix_set",
              "domain_keyword_set",
              "domain_regex_set",
              "domain_wildcard_set",

              "geoip_set",
              "ip_cidr_set",
              "ip_cidr6_set",
              "asn_set",

              "url_regex_set",
              "user_agent_set",
              "dest_port_set",
              "protocol_set",
          ]

          IP_TYPES = {
              "IP-CIDR",
              "IP-CIDR6",
              "IP-ASN",
              "ASN",
              "GEOIP",
          }

          stats = {
              "generated": 0,
              "deprecated": 0,
              "empty": 0,
              "unsupported": 0,
              "no_resolve_files": 0,
          }

          skipped_files = []
          unsupported_rules = []
          no_resolve_files = []


          # ------------------------------------------------------
          # 所有值统一输出为安全双引号
          # ------------------------------------------------------

          def yaml_quote(value: str) -> str:
              return json.dumps(
                  value.strip(),
                  ensure_ascii=False
              )


          def add_value(groups, key, value):
              value = value.strip()

              if not value:
                  return

              if key not in groups:
                  groups[key] = []

              if value not in groups[key]:
                  groups[key].append(value)


          def is_deprecated(text: str) -> bool:
              lower = text.lower()

              return (
                  "deprecated" in lower
                  or "has been merged with" in lower
                  or "has been merged into" in lower
              )


          # ------------------------------------------------------
          # 写 Egern YAML
          #
          # no_resolve=True 时放在文件最前面
          # ------------------------------------------------------

          def write_yaml(
              dst: Path,
              groups,
              no_resolve: bool = False
          ) -> bool:

              has_rules = any(
                  groups.get(key)
                  for key in OUTPUT_ORDER
              )

              if not has_rules:
                  return False

              dst.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              with dst.open(
                  "w",
                  encoding="utf-8"
              ) as f:

                  if no_resolve:
                      f.write("no_resolve: true\n")

                      # 分隔一下，便于阅读
                      if has_rules:
                          f.write("\n")

                  for key in OUTPUT_ORDER:

                      values = groups.get(key)

                      if not values:
                          continue

                      f.write(f"{key}:\n")

                      for value in values:
                          f.write(
                              f"  - {yaml_quote(value)}\n"
                          )

                      f.write("\n")

              return True


          # ------------------------------------------------------
          # domainset
          # ------------------------------------------------------

          def convert_domainset(src: Path, dst: Path):

              text = src.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              if is_deprecated(text):

                  stats["deprecated"] += 1

                  skipped_files.append(
                      f"DEPRECATED: domainset/{src.name}"
                  )

                  return

              groups = OrderedDict()

              for raw in text.splitlines():

                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  if line.startswith("."):

                      add_value(
                          groups,
                          "domain_suffix_set",
                          line[1:]
                      )

                  else:

                      add_value(
                          groups,
                          "domain_set",
                          line
                      )


              if write_yaml(
                  dst,
                  groups,
                  no_resolve=False
              ):

                  stats["generated"] += 1

              else:

                  stats["empty"] += 1

                  skipped_files.append(
                      f"EMPTY: domainset/{src.name}"
                  )


          # ------------------------------------------------------
          # non_ip / ip
          # ------------------------------------------------------

          def convert_standard(src: Path, dst: Path, category: str):

              text = src.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              if is_deprecated(text):

                  stats["deprecated"] += 1

                  skipped_files.append(
                      f"DEPRECATED: {category}/{src.name}"
                  )

                  return

              groups = OrderedDict()

              file_no_resolve = False


              for raw in text.splitlines():

                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  if "," not in line:

                      stats["unsupported"] += 1

                      unsupported_rules.append(
                          f"{category}/{src.name}: {line}"
                      )

                      continue


                  # 只拆第一个逗号
                  rule_type, value = line.split(",", 1)

                  rule_type = rule_type.strip().upper()

                  value = value.strip()


                  # ----------------------------------------------
                  # 先找对应 Egern field
                  # ----------------------------------------------

                  field = TYPE_MAP.get(rule_type)

                  if not field:

                      stats["unsupported"] += 1

                      unsupported_rules.append(
                          f"{category}/{src.name}: {line}"
                      )

                      continue


                  # ----------------------------------------------
                  # no-resolve 语义转换
                  #
                  # Sukka:
                  #
                  # IP-CIDR,1.1.1.0/24,no-resolve
                  #
                  # Egern:
                  #
                  # no_resolve: true
                  #
                  # ip_cidr_set:
                  #   - "1.1.1.0/24"
                  # ----------------------------------------------

                  if rule_type in IP_TYPES:

                      suffix = ",no-resolve"

                      if value.lower().endswith(suffix):

                          file_no_resolve = True

                          value = value[
                              :-len(suffix)
                          ].strip()


                  if not value:

                      stats["unsupported"] += 1

                      unsupported_rules.append(
                          f"{category}/{src.name}: {line}"
                      )

                      continue


                  add_value(
                      groups,
                      field,
                      value
                  )


              if write_yaml(
                  dst,
                  groups,
                  no_resolve=file_no_resolve
              ):

                  stats["generated"] += 1


                  if file_no_resolve:

                      stats["no_resolve_files"] += 1

                      no_resolve_files.append(
                          f"{category}/{src.name}"
                      )

              else:

                  stats["empty"] += 1

                  skipped_files.append(
                      f"EMPTY: {category}/{src.name}"
                  )


          # ------------------------------------------------------
          # Convert domainset
          # ------------------------------------------------------

          for src in sorted(
              (SOURCE_ROOT / "domainset").glob("*.conf")
          ):

              dst = (
                  OUTPUT_ROOT
                  / "domain"
                  / f"{src.stem}.yaml"
              )

              convert_domainset(
                  src,
                  dst
              )


          # ------------------------------------------------------
          # Convert non_ip
          # ------------------------------------------------------

          for src in sorted(
              (SOURCE_ROOT / "non_ip").glob("*.conf")
          ):

              dst = (
                  OUTPUT_ROOT
                  / "non_ip"
                  / f"{src.stem}.yaml"
              )

              convert_standard(
                  src,
                  dst,
                  "non_ip"
              )


          # ------------------------------------------------------
          # Convert ip
          # ------------------------------------------------------

          for src in sorted(
              (SOURCE_ROOT / "ip").glob("*.conf")
          ):

              dst = (
                  OUTPUT_ROOT
                  / "ip"
                  / f"{src.stem}.yaml"
              )

              convert_standard(
                  src,
                  dst,
                  "ip"
              )


          # ------------------------------------------------------
          # Statistics
          # ------------------------------------------------------

          print("")
          print("====================================")
          print(" Sukka -> Egern V1.1.3")
          print("====================================")
          print(f" Generated        : {stats['generated']}")
          print(f" no_resolve files : {stats['no_resolve_files']}")
          print(f" Deprecated       : {stats['deprecated']}")
          print(f" Empty            : {stats['empty']}")
          print(f" Unsupported      : {stats['unsupported']}")
          print("====================================")


          # ------------------------------------------------------
          # Reports
          # ------------------------------------------------------

          if skipped_files:

              Path(
                  "/tmp/sukka-egern/skipped.txt"
              ).write_text(
                  "\n".join(skipped_files),
                  encoding="utf-8"
              )


          if unsupported_rules:

              Path(
                  "/tmp/sukka-egern/unsupported.txt"
              ).write_text(
                  "\n".join(unsupported_rules),
                  encoding="utf-8"
              )


          if no_resolve_files:

              Path(
                  "/tmp/sukka-egern/no_resolve.txt"
              ).write_text(
                  "\n".join(no_resolve_files),
                  encoding="utf-8"
              )

              print("")
              print("no_resolve enabled:")

              for item in no_resolve_files:
                  print(f"  {item}")


          if stats["generated"] == 0:

              raise SystemExit(
                  "ERROR: No Egern rules generated."
              )

          PY


      # ==========================================================
      # 8. Basic output validation
      # ==========================================================

      - name: Validate Egern output
        run: |
          set -euo pipefail

          DOMAIN=$(
            find /tmp/sukka-egern/output/domain \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          NON_IP=$(
            find /tmp/sukka-egern/output/non_ip \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          IP=$(
            find /tmp/sukka-egern/output/ip \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          TOTAL=$((DOMAIN + NON_IP + IP))


          echo ""
          echo "===================================="
          echo " Egern Rule Sets"
          echo "===================================="
          echo " domain : ${DOMAIN}"
          echo " non_ip : ${NON_IP}"
          echo " ip     : ${IP}"
          echo "------------------------------------"
          echo " TOTAL  : ${TOTAL}"
          echo "===================================="


          if [ "${TOTAL}" -lt "${MIN_TOTAL_RULES}" ]; then

            echo "ERROR: Too few Egern rule sets."

            exit 1
          fi


          if [ "${DOMAIN}" -eq 0 ] || \
             [ "${NON_IP}" -eq 0 ] || \
             [ "${IP}" -eq 0 ]; then

            echo "ERROR: One or more categories are empty."

            exit 1
          fi


          EMPTY=0


          while IFS= read -r FILE; do

            if [ ! -s "${FILE}" ]; then

              echo "ERROR: Empty YAML:"
              echo "${FILE}"

              EMPTY=$((EMPTY + 1))

            fi

          done < <(
            find /tmp/sukka-egern/output \
              -type f \
              -name "*.yaml"
          )


          if [ "${EMPTY}" -ne 0 ]; then
            exit 1
          fi


      # ==========================================================
      # 9. Install PyYAML
      # ==========================================================

      - name: Install YAML validator
        run: |
          set -euo pipefail

          python3 -m pip install \
            --quiet \
            pyyaml


      # ==========================================================
      # 10. Parse + semantic validation
      # ==========================================================

      - name: Parse Egern YAML
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import yaml

          ROOT = Path(
              "/tmp/sukka-egern/output"
          )

          ALLOWED_KEYS = {
              "domain_set",
              "domain_suffix_set",
              "domain_keyword_set",
              "domain_regex_set",
              "domain_wildcard_set",

              "geoip_set",
              "ip_cidr_set",
              "ip_cidr6_set",
              "asn_set",

              "url_regex_set",
              "user_agent_set",
              "dest_port_set",
              "protocol_set",

              "no_resolve",
          }

          IP_KEYS = {
              "geoip_set",
              "ip_cidr_set",
              "ip_cidr6_set",
              "asn_set",
          }

          count = 0
          no_resolve_count = 0

          for file in sorted(
              ROOT.rglob("*.yaml")
          ):

              try:

                  with file.open(
                      "r",
                      encoding="utf-8"
                  ) as f:

                      data = yaml.safe_load(f)

              except Exception as exc:

                  raise RuntimeError(
                      f"YAML parse failed: {file}: {exc}"
                  ) from exc


              if not isinstance(data, dict):

                  raise RuntimeError(
                      f"Invalid YAML object: {file}"
                  )


              unknown = (
                  set(data.keys())
                  - ALLOWED_KEYS
              )

              if unknown:

                  raise RuntimeError(
                      f"Unknown keys in {file}: "
                      f"{sorted(unknown)}"
                  )


              for key, value in data.items():

                  if key == "no_resolve":

                      if not isinstance(value, bool):

                          raise RuntimeError(
                              f"{file}: "
                              f"no_resolve must be boolean"
                          )

                      if value is True:

                          no_resolve_count += 1

                          # no_resolve 没有 IP 类规则就没有意义
                          if not any(
                              ip_key in data
                              for ip_key in IP_KEYS
                          ):

                              raise RuntimeError(
                                  f"{file}: "
                                  f"no_resolve=true but no "
                                  f"IP-related rule set exists"
                              )

                      continue


                  if not isinstance(value, list):

                      raise RuntimeError(
                          f"{file}: {key} is not a list"
                      )


                  if not value:

                      raise RuntimeError(
                          f"{file}: {key} is empty"
                      )


              count += 1


          if count == 0:

              raise RuntimeError(
                  "No YAML files validated."
              )


          print("")
          print(
              f"Validated {count} "
              f"Egern YAML files."
          )

          print(
              f"no_resolve=true files: "
              f"{no_resolve_count}"
          )

          PY


      # ==========================================================
      # 11. Generate conversion report
      # ==========================================================

      - name: Generate conversion report
        run: |
          set -euo pipefail

          {
            echo "# Sukka -> Egern Conversion Report"
            echo ""
            echo "Source:"
            echo ""
            echo "https://ruleset.skk.moe/"
            echo ""


            echo "## no_resolve enabled"
            echo ""

            if [ -s /tmp/sukka-egern/no_resolve.txt ]; then

              sed 's/^/- /' \
                /tmp/sukka-egern/no_resolve.txt

            else

              echo "- None"

            fi


            echo ""
            echo "## Skipped source files"
            echo ""

            if [ -s /tmp/sukka-egern/skipped.txt ]; then

              sed 's/^/- /' \
                /tmp/sukka-egern/skipped.txt

            else

              echo "- None"

            fi


            echo ""
            echo "## Unsupported rule lines"
            echo ""

            if [ -s /tmp/sukka-egern/unsupported.txt ]; then

              echo '```text'

              cat /tmp/sukka-egern/unsupported.txt

              echo '```'

            else

              echo "None"

            fi


          } > /tmp/sukka-egern/REPORT.md


      # ==========================================================
      # 12. Generate new checksum
      # ==========================================================

      - name: Generate new checksum
        run: |
          set -euo pipefail

          cd /tmp/sukka-egern/output

          find domain non_ip ip \
            -type f \
            -name "*.yaml" \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/sukka-egern/new.sha256

          sha256sum \
            /tmp/sukka-egern/new.sha256 \
            | awk '{print $1}' \
            > /tmp/sukka-egern/new.master

          echo ""
          echo "New version:"

          cat /tmp/sukka-egern/new.master


      # ==========================================================
      # 13. Generate current checksum
      # ==========================================================

      - name: Generate current checksum
        run: |
          set -euo pipefail

          if [ -d domain ] && \
             [ -d non_ip ] && \
             [ -d ip ] && \
             find domain non_ip ip \
               -type f \
               -name "*.yaml" \
               | grep -q .; then

            find domain non_ip ip \
              -type f \
              -name "*.yaml" \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > /tmp/sukka-egern/current.sha256

            sha256sum \
              /tmp/sukka-egern/current.sha256 \
              | awk '{print $1}' \
              > /tmp/sukka-egern/current.master

          else

            echo "none" \
              > /tmp/sukka-egern/current.master

          fi


      # ==========================================================
      # 14. Compare rule versions
      # ==========================================================

      - name: Compare rule versions
        id: compare
        run: |
          set -euo pipefail

          NEW=$(cat /tmp/sukka-egern/new.master)
          OLD=$(cat /tmp/sukka-egern/current.master)

          echo "Old: ${OLD}"
          echo "New: ${NEW}"


          if [ "${NEW}" = "${OLD}" ]; then

            echo "changed=false" \
              >> "$GITHUB_OUTPUT"

            echo "Rules are already up to date."

          else

            echo "changed=true" \
              >> "$GITHUB_OUTPUT"

            echo "Rule update detected."

          fi


      # ==========================================================
      # 15. No update
      # ==========================================================

      - name: No update required
        if: steps.compare.outputs.changed == 'false'
        run: |
          echo ""
          echo "===================================="
          echo " Sukka List -> Egern V1.1.3"
          echo "===================================="
          echo " STATUS : UP TO DATE"
          echo " COMMIT : NO"
          echo "===================================="


      # ==========================================================
      # 16. Replace Egern rules
      # ==========================================================

      - name: Replace Egern rules
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          rm -rf domain.new
          rm -rf non_ip.new
          rm -rf ip.new


          cp -a \
            /tmp/sukka-egern/output/domain \
            domain.new

          cp -a \
            /tmp/sukka-egern/output/non_ip \
            non_ip.new

          cp -a \
            /tmp/sukka-egern/output/ip \
            ip.new


          NEW_DOMAIN=$(
            find domain.new \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          NEW_NON_IP=$(
            find non_ip.new \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          NEW_IP=$(
            find ip.new \
              -type f \
              -name "*.yaml" \
              | wc -l
          )


          TOTAL=$((NEW_DOMAIN + NEW_NON_IP + NEW_IP))


          echo ""
          echo "===================================="
          echo " New Egern Rules"
          echo "===================================="
          echo " domain : ${NEW_DOMAIN}"
          echo " non_ip : ${NEW_NON_IP}"
          echo " ip     : ${NEW_IP}"
          echo "------------------------------------"
          echo " TOTAL  : ${TOTAL}"
          echo "===================================="


          if [ "${TOTAL}" \
            -lt "${MIN_TOTAL_RULES}" ]; then

            echo "ERROR:"
            echo "Pre-replacement validation failed."

            rm -rf \
              domain.new \
              non_ip.new \
              ip.new

            exit 1
          fi


          if [ "${NEW_DOMAIN}" -eq 0 ] || \
             [ "${NEW_NON_IP}" -eq 0 ] || \
             [ "${NEW_IP}" -eq 0 ]; then

            echo "ERROR:"
            echo "One or more rule categories are empty."

            rm -rf \
              domain.new \
              non_ip.new \
              ip.new

            exit 1
          fi


          rm -rf \
            domain \
            non_ip \
            ip


          mv domain.new domain
          mv non_ip.new non_ip
          mv ip.new ip


          echo ""
          echo "Egern rules replaced successfully."


      # ==========================================================
      # 17. Save checksums
      # ==========================================================

      - name: Save checksums
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          cp \
            /tmp/sukka-egern/new.sha256 \
            RULES_SHA256SUMS.txt

          cp \
            /tmp/sukka-egern/new.master \
            RULES_VERSION.sha256


      # ==========================================================
      # 18. Save conversion report
      # ==========================================================

      - name: Save conversion report
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          cp \
            /tmp/sukka-egern/REPORT.md \
            CONVERSION_REPORT.md


      # ==========================================================
      # 19. Update README
      # ==========================================================

      - name: Update README
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          DOMAIN=$(
            find domain \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          NON_IP=$(
            find non_ip \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          IP=$(
            find ip \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          TOTAL=$((DOMAIN + NON_IP + IP))


          NO_RESOLVE=$(
            grep -rl '^no_resolve: true$' \
              domain non_ip ip \
              --include="*.yaml" \
              2>/dev/null \
              | wc -l
          )


          VERSION=$(cat RULES_VERSION.sha256)


          cat > README.md <<EOF
          # Sukka Rules for Egern

          自动将 Sukka Ruleset Server 的通用 List 规则转换为 Egern Rule Set。

          ## Upstream

          https://ruleset.skk.moe/

          ## Source

          \`\`\`text
          List/domainset
          List/non_ip
          List/ip
          \`\`\`

          ## Output

          \`\`\`text
          domain/
          non_ip/
          ip/
          \`\`\`

          ## Rule Count

          | Type | Count |
          |---|---:|
          | domain | ${DOMAIN} |
          | non_ip | ${NON_IP} |
          | ip | ${IP} |
          | Total | ${TOTAL} |
          | no_resolve enabled | ${NO_RESOLVE} |

          ## Current Version

          \`\`\`
          ${VERSION}
          \`\`\`

          ## no_resolve

          Sukka 源规则中的：

          \`\`\`text
          IP-CIDR,...,no-resolve
          IP-CIDR6,...,no-resolve
          IP-ASN,...,no-resolve
          GEOIP,...,no-resolve
          \`\`\`

          会自动转换为 Egern Rule Set 顶层：

          \`\`\`yaml
          no_resolve: true
          \`\`\`

          只有源规则实际包含 \`no-resolve\` 时才会添加。

          ## Raw URL Examples

          \`\`\`text
          https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/domain/apple_cdn.yaml

          https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/non_ip/ai.yaml

          https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/ip/telegram.yaml
          \`\`\`

          ## Egern Example

          \`\`\`yaml
          rules:

            - rule_set:
                match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/non_ip/ai.yaml"
                policy: 🤖 AI
                update_interval: 86400

            - rule_set:
                match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/ip/ai.yaml"
                policy: 🤖 AI
                update_interval: 86400

            - default:
                policy: DIRECT
          \`\`\`

          ## Features

          - 每 24 小时自动同步
          - 直接读取 Sukka List
          - 自动转换为 Egern YAML
          - 精确保留 no-resolve 语义
          - 所有规则值安全双引号
          - 支持 DOMAIN-WILDCARD
          - 支持 IP-ASN
          - 支持 IPv6、百分号、正则
          - 自动跳过 Deprecated 文件
          - 自动跳过纯注释规则
          - YAML 自动解析验证
          - SHA256 版本校验
          - 无变化不 Commit
          - 转换失败不覆盖旧规则
          - 自动生成转换报告

          ---

          Generated by Sukka List -> Egern V1.1.3.
          EOF


      # ==========================================================
      # 20. Final validation
      # ==========================================================

      - name: Final validation
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          DOMAIN=$(
            find domain \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          NON_IP=$(
            find non_ip \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          IP=$(
            find ip \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          TOTAL=$((DOMAIN + NON_IP + IP))


          NO_RESOLVE=$(
            grep -rl '^no_resolve: true$' \
              domain non_ip ip \
              --include="*.yaml" \
              2>/dev/null \
              | wc -l
          )


          echo ""
          echo "===================================="
          echo " Final Validation"
          echo "===================================="
          echo " domain     : ${DOMAIN}"
          echo " non_ip     : ${NON_IP}"
          echo " ip         : ${IP}"
          echo " no_resolve : ${NO_RESOLVE}"
          echo "------------------------------------"
          echo " TOTAL      : ${TOTAL}"
          echo "===================================="


          if [ "${TOTAL}" \
            -lt "${MIN_TOTAL_RULES}" ]; then

            echo "ERROR:"
            echo "Final rule count too low."

            exit 1
          fi


          if [ "${DOMAIN}" -eq 0 ] || \
             [ "${NON_IP}" -eq 0 ] || \
             [ "${IP}" -eq 0 ]; then

            echo "ERROR:"
            echo "Final category validation failed."

            exit 1
          fi


          if [ ! -s RULES_SHA256SUMS.txt ]; then

            echo "ERROR:"
            echo "RULES_SHA256SUMS.txt missing."

            exit 1
          fi


          if [ ! -s RULES_VERSION.sha256 ]; then

            echo "ERROR:"
            echo "RULES_VERSION.sha256 missing."

            exit 1
          fi


          if [ ! -s CONVERSION_REPORT.md ]; then

            echo "ERROR:"
            echo "CONVERSION_REPORT.md missing."

            exit 1
          fi


      # ==========================================================
      # 21. Commit
      # ==========================================================

      - name: Commit changes
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git add -A


          if git diff \
            --cached \
            --quiet; then

            echo "No effective changes."

            exit 0
          fi


          git commit \
            -m "chore: sync Sukka List rules for Egern"


          git push


      # ==========================================================
      # 22. Completed
      # ==========================================================

      - name: Completed
        run: |
          echo ""
          echo "===================================="
          echo " Sukka List -> Egern V1.1.3"
          echo "===================================="
          echo " SOURCE     : Sukka List"
          echo " FORMAT     : Egern YAML"
          echo " no_resolve : preserved"
          echo " SYNC       : 24 hours"
          echo " STATUS     : SUCCESS"
          echo "===================================="
