              "同时精确表达需要解析与禁止解析的 IP 条目。原文件名继续兼容旧配置；",
              "如果需要严格保留上游语义，改为按以下顺序引用两个拆分文件。",
              "若混合源文件还包含真实域名规则，则会额外生成 `.non_ip.yaml`，",
              "应先引用该域名文件，再引用 `.no_resolve.yaml` 和 `.resolve.yaml`。",
              "",
              "```yaml",
              "rules:",
              "  - rule_set:",
              f"      match: \"{raw_base}/ip/reject.no_resolve.yaml\"",
              "      policy: REJECT",
              "      update_interval: 86400",
              "",
              "  - rule_set:",
              f"      match: \"{raw_base}/ip/reject.resolve.yaml\"",
              "      policy: REJECT",
              "      update_interval: 86400",
              "```",
              "",
              "仅对实际包含混合 `no-resolve` 语义的源文件生成拆分版本。",
              "具体名单参见 `CONVERSION_REPORT.md` 与 `CONVERSION_AUDIT.json`。",
              "完整严格语义引用片段见 `EGERN_RULES_STRICT.yaml`。",
              "",
              "## 分类与建议顺序",
              "",
              "1. `domain/`：纯域名规则。",
              "2. `non_ip/`：域名、通配符、关键字和 URL 等非 IP 规则。",
              "3. `ip/`：IPv4、IPv6、ASN 和 GeoIP 规则。",
              "4. `lite/domain/`、`lite/non_ip/`、`lite/ip/`：iOS 轻量规则。",
              "",
              "建议先放 `domain/` 和 `non_ip/`，最后放 `ip/`，减少提前 DNS 查询。",
              "",
              "## 当前规则版本",
              "",
              "```text",
              version,
              "```",
              "",
              "Generated by Sukka List → Egern V1.3.0 iOS Lite & Semantic Compression.",
          ]

          Path("README.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Verify final staged repository output
        if: steps.upstream.outputs.changed == 'true' && steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          for REQUIRED in \
            RULES_SHA256SUMS.txt \
            RULES_VERSION.sha256 \
            CONVERSION_REPORT.md \
            CONVERSION_AUDIT.json \
            SOURCE_MANIFEST.json \
            EGERN_RULES_STRICT.yaml \
            EGERN_RULES_IOS_LITE.yaml \
            README.md; do

            if [ ! -s "${REQUIRED}" ]; then
              echo "ERROR: Required repository artifact missing: ${REQUIRED}"
              exit 1
            fi
          done

          sha256sum --check RULES_SHA256SUMS.txt --status

          if grep -ril \
            '7h15\.ru1353t\.1s\.m4d3\.by\.5ukk4w\.skk\.moe' \
            domain non_ip ip lite \
            --include='*.yaml'; then

            echo "ERROR: Marker residue detected in final Egern YAML files."
            exit 1
          fi

      - name: Commit validated Egern rules
        if: steps.upstream.outputs.changed == 'true' && steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git add -A -- \
            domain \
            non_ip \
            ip \
            lite \
            RULES_SHA256SUMS.txt \
            RULES_VERSION.sha256 \
            CONVERSION_REPORT.md \
            CONVERSION_AUDIT.json \
            SOURCE_MANIFEST.json \
            EGERN_RULES_STRICT.yaml \
            EGERN_RULES_IOS_LITE.yaml \
            README.md

          if git diff --cached --quiet; then
            echo "No effective repository changes remain."
            exit 0
          fi

          git commit -m "chore: sync optimized Egern and iOS Lite Sukka rules"
          git push

      - name: Publish GitHub Actions run summary
        if: always()
        run: |
          if [ -s "${WORK_ROOT}/REPORT.md" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "${WORK_ROOT}/REPORT.md" >> "${GITHUB_STEP_SUMMARY}"
          elif [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '%s\n' 'Upstream unchanged or no conversion report available.' \
              >> "${GITHUB_STEP_SUMMARY}"
          fi
