      - name: Generate deterministic ruleset checksums
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import os

          root = Path(os.environ["WORK_ROOT"])
          output = root / "output"
          fragments = root / "fragments"
          fragment_names = ("EGERN_RULES_STRICT.yaml", "EGERN_RULES_IOS_LITE.yaml")


          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()


          def manifest(entries):
              return "".join(
                  f"{sha256_file(path)}  {relative}\n"
                  for relative, path in sorted(entries, key=lambda item: item[0])
              )


          new_entries = [
              (file.relative_to(output).as_posix(), file)
              for file in output.rglob("*.yaml")
          ]
          new_entries.extend((name, fragments / name) for name in fragment_names)
          new_manifest = manifest(new_entries)
          root.joinpath("new.sha256").write_text(new_manifest, encoding="utf-8")
          root.joinpath("new.master").write_text(
              hashlib.sha256(new_manifest.encode("utf-8")).hexdigest() + "\n",
              encoding="utf-8",
          )

          current_entries = []
          for category in ("domain", "non_ip", "ip", "lite"):
              directory = Path(category)
              if directory.is_dir():
                  current_entries.extend(
                      (file.as_posix(), file) for file in directory.rglob("*.yaml")
                  )
          for name in fragment_names:
              file = Path(name)
              if file.is_file():
                  current_entries.append((name, file))

          if current_entries:
              current_manifest = manifest(current_entries)
              root.joinpath("current.sha256").write_text(
                  current_manifest, encoding="utf-8"
              )
              root.joinpath("current.master").write_text(
                  hashlib.sha256(current_manifest.encode("utf-8")).hexdigest() + "\n",
                  encoding="utf-8",
              )
          else:
              root.joinpath("current.master").write_text("none\n", encoding="utf-8")

          print(f"Checksum covers {len(new_entries)} full, iOS Lite, and fragment files.")
          PY

      - name: Compare converted rules against repository
        id: compare
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail

          OLD="$(cat "${WORK_ROOT}/current.master")"
          NEW="$(cat "${WORK_ROOT}/new.master")"
          echo "Current: ${OLD}"
          echo "New:     ${NEW}"

          if [ "${OLD}" = "${NEW}" ]; then
            printf '%s\n' "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Converted rules are already current."
          else
            printf '%s\n' "changed=true" >> "${GITHUB_OUTPUT}"
            echo "A validated ruleset update is available."
          fi

      - name: Replace rules only after all validation passes
        if: steps.upstream.outputs.changed == 'true' && steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          for CATEGORY in domain non_ip ip; do
            rm -rf "${CATEGORY}.new"
            cp -a "${WORK_ROOT}/output/${CATEGORY}" "${CATEGORY}.new"

            if [ -z "$(find "${CATEGORY}.new" -type f -name '*.yaml' -print -quit)" ]; then
              echo "ERROR: Empty staged ruleset category: ${CATEGORY}"
              rm -rf domain.new non_ip.new ip.new
              exit 1
            fi
          done

          rm -rf lite.new
          cp -a "${WORK_ROOT}/output/lite" lite.new

          for CATEGORY in domain non_ip ip; do
            rm -rf "${CATEGORY}"
            mv "${CATEGORY}.new" "${CATEGORY}"
          done

          rm -rf lite
          mv lite.new lite

          cp "${WORK_ROOT}/new.sha256" RULES_SHA256SUMS.txt
          cp "${WORK_ROOT}/new.master" RULES_VERSION.sha256
          cp "${WORK_ROOT}/REPORT.md" CONVERSION_REPORT.md
          cp "${WORK_ROOT}/conversion_audit.json" CONVERSION_AUDIT.json
          cp "${WORK_ROOT}/SOURCE_MANIFEST.json" SOURCE_MANIFEST.json
          cp "${WORK_ROOT}/fragments/EGERN_RULES_STRICT.yaml" EGERN_RULES_STRICT.yaml
          cp "${WORK_ROOT}/fragments/EGERN_RULES_IOS_LITE.yaml" EGERN_RULES_IOS_LITE.yaml

