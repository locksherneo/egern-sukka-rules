rules:
# 第一阶段：仅匹配域名 / 非 IP 规则，避免提前触发 DNS 解析。
- rule_set:
    match: https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/non_ip/reject-drop.yaml
    policy: REJECT
    update_interval: 86400
- rule_set:
    match: https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/non_ip/reject-no-drop.yaml
    policy: REJECT
    update_interval: 86400
- rule_set:
    match: https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/non_ip/reject.yaml
    policy: REJECT
    update_interval: 86400
- rule_set:
    match: https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/non_ip/lan.yaml
    policy: DIRECT
    update_interval: 86400
# 局域网先放行；即使代理 DNS 绕过 forward，广告连接仍会在此被拒绝。
- domain_regex:
    match: '^(ad|ads)\..+$'
    policy: REJECT
- rule_set:
    match: https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/non_ip/direct.yaml
    policy: DIRECT
    update_interval: 86400
- rule_set:
    match: https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/domain/download.yaml
    policy: 📥 大文件下载
    update_interval: 86400
- rule_set:
    match: https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/domain/game-download.yaml
    policy: 📥 大文件下载
    update_interval: 86400
- rule_set:
    match: https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/non_ip/download.yaml
    policy: 📥 大文件下载
    update_interval: 86400
