# Egern iOS Lite fragment; replace YOUR_POLICY with an existing group.
# Order: domain rules, non-IP rules, then IP rules.
rules:
  - rule_set:
      match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/domain/apple_cdn.yaml"
      policy: "DIRECT"
      update_interval: 86400
  - rule_set:
      match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/domain/cdn.yaml"
      policy: "YOUR_POLICY"
      update_interval: 86400
  - rule_set:
      match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/non_ip/reject.yaml"
      policy: "REJECT"
      update_interval: 86400
  - rule_set:
      match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/non_ip/ai.yaml"
      policy: "YOUR_POLICY"
      update_interval: 86400
  - rule_set:
      match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/non_ip/apple_services.yaml"
      policy: "YOUR_POLICY"
      update_interval: 86400
  - rule_set:
      match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/non_ip/microsoft.yaml"
      policy: "YOUR_POLICY"
      update_interval: 86400
  - rule_set:
      match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/non_ip/stream.yaml"
      policy: "YOUR_POLICY"
      update_interval: 86400
  - rule_set:
      match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/non_ip/telegram.yaml"
      policy: "YOUR_POLICY"
      update_interval: 86400
  - rule_set:
      match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/ip/ai.yaml"
      policy: "YOUR_POLICY"
      update_interval: 86400
  - rule_set:
      match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/ip/apple_services.yaml"
      policy: "YOUR_POLICY"
      update_interval: 86400
  - rule_set:
      match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/ip/telegram.yaml"
      policy: "YOUR_POLICY"
      update_interval: 86400
  - rule_set:
      match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/ip/lan.yaml"
      policy: "DIRECT"
      update_interval: 86400
  - rule_set:
      match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/ip/reject.no_resolve.yaml"
      policy: "REJECT"
      update_interval: 86400
  - rule_set:
      match: "https://raw.githubusercontent.com/locksherneo/egern-sukka-rules/main/lite/ip/reject.resolve.yaml"
      policy: "REJECT"
      update_interval: 86400
