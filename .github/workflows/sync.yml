name: Sukka List to Egern V1.3.0 iOS Lite Semantic Compression

"on":
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild even when the upstream build has not changed"
        type: boolean
        required: false
        default: false
      allow_large_changes:
        description: "Allow a large drop in upstream files or rule coverage"
        type: boolean
        required: false
        default: false
  schedule:
    # GitHub Actions uses UTC: 06:20 UTC = 03:20 in Sao Paulo.
    - cron: "20 6 * * *"

permissions:
  contents: write

concurrency:
  group: sukka-egern-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      SOURCE_BASE: https://ruleset.skk.moe
      SOURCE_MIRROR: https://ruleset-mirror.skk.moe
      MIN_TOTAL_RULES: "20"
      DOWNLOAD_WORKERS: "6"
      MAX_SOURCE_FILE_MB: "40"
      MAX_FILE_DROP_PERCENT: "20"
      MAX_RULE_DROP_PERCENT: "25"
      MIN_CONVERSION_COVERAGE: "99.0"
      ENABLE_IOS_LITE: "true"
      IOS_MAX_RULES_PER_SET: "25000"
      IOS_EXCLUDE_LARGE_REJECT: "true"
      IOS_EXCLUDE_REJECT_EXTRA: "true"
      IOS_EXCLUDE_REJECT_PHISHING: "true"
      IOS_EXCLUDE_URL_REGEX: "true"
      ENABLE_DOMAIN_SEMANTIC_COMPRESSION: "true"
      ENABLE_CIDR_SEMANTIC_COMPRESSION: "true"
      FAIL_ON_INVALID_RULES: "true"
      FAIL_ON_UNSUPPORTED_RULES: "false"
      STRICT_CATEGORY_VALIDATION: "false"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      FORCE_REBUILD: ${{ inputs.force_rebuild && 'true' || 'false' }}
      ALLOW_LARGE_CHANGES: ${{ inputs.allow_large_changes && 'true' || 'false' }}
      REQUIRED_RULESETS: >-
        domain/apple_cdn.yaml,
        domain/cdn.yaml,
        non_ip/ai.yaml,
        non_ip/telegram.yaml,
        ip/ai.yaml,
        ip/telegram.yaml
      WORK_ROOT: /tmp/sukka-egern
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1, pinned to its verified upstream commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Configure Git
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare isolated workspace
        run: |
          set -euo pipefail
          rm -rf "${WORK_ROOT}"
          mkdir -p \
            "${WORK_ROOT}/source/domainset" \
            "${WORK_ROOT}/source/non_ip" \
            "${WORK_ROOT}/source/ip" \
            "${WORK_ROOT}/clean/domainset" \
            "${WORK_ROOT}/clean/non_ip" \
            "${WORK_ROOT}/clean/ip" \
            "${WORK_ROOT}/output/domain" \
            "${WORK_ROOT}/output/non_ip" \
            "${WORK_ROOT}/output/ip" \
            "${WORK_ROOT}/output/lite/domain" \
            "${WORK_ROOT}/output/lite/non_ip" \
            "${WORK_ROOT}/output/lite/ip" \
            "${WORK_ROOT}/fragments"

      - name: Fetch upstream index with official mirror fallback
        run: |
          set -euo pipefail

          SELECTED=""

          for CANDIDATE in "${SOURCE_BASE}" "${SOURCE_MIRROR}"; do
            echo "Checking ${CANDIDATE}/"

            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 90 \
              "${CANDIDATE}/" \
              -o "${WORK_ROOT}/index.html"; then

              if [ "$(wc -c < "${WORK_ROOT}/index.html")" -ge 500 ]; then
                SELECTED="${CANDIDATE}"
                break
              fi
            fi
          done

          if [ -z "${SELECTED}" ]; then
            echo "ERROR: Both upstream index endpoints are unavailable."
            exit 1
          fi

          printf '%s\n' "${SELECTED}" > "${WORK_ROOT}/source_base.txt"
          echo "Selected upstream: ${SELECTED}"

      - name: Detect unchanged upstream build safely
        id: upstream
        run: |
          set -euo pipefail

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import os
          import re

          root = Path(os.environ["WORK_ROOT"])


          class VisibleTextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  if data.strip():
                      self.parts.append(data.strip())


          parser = VisibleTextParser()
          parser.feed(root.joinpath("index.html").read_text(
              encoding="utf-8", errors="replace"
          ))
          visible = " ".join(parser.parts)
          match = re.search(
              r"Last\s+Build\s*:\s*([0-9T:.+\-Z]+)", visible, flags=re.IGNORECASE
          )
          current_build = match.group(1) if match else ""
          root.joinpath("index_build.txt").write_text(
              current_build + "\n", encoding="utf-8"
          )

          previous_build = ""
          manifest_path = Path("SOURCE_MANIFEST.json")
          if manifest_path.is_file():
              try:
                  previous_build = json.loads(
                      manifest_path.read_text(encoding="utf-8")
                  ).get("upstream_build", "")
              except (ValueError, OSError):
                  previous_build = ""

          required_roots = ("domain", "non_ip", "ip", "lite")
          repository_complete = all(Path(item).is_dir() for item in required_roots)
          repository_complete = repository_complete and all(
              Path(item).is_file()
              for item in (
                  "CONVERSION_AUDIT.json",
                  "SOURCE_MANIFEST.json",
                  "EGERN_RULES_STRICT.yaml",
                  "EGERN_RULES_IOS_LITE.yaml",
              )
          )
          force = os.environ.get("FORCE_REBUILD", "false").casefold() == "true"
          changed = not (
              current_build
              and current_build == previous_build
              and repository_complete
              and not force
          )

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"changed={'true' if changed else 'false'}\n")

          print(f"Upstream build: {current_build or 'not advertised'}")
          print(f"Previous build: {previous_build or 'none'}")
          print(f"Force rebuild:  {force}")
          print("Rebuild required." if changed else "Upstream is unchanged; skipping rebuild.")
          PY

      - name: Discover Sukka List source files
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail

          python3 <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          import os
          import re

          root = Path(os.environ["WORK_ROOT"])
          source_base = root.joinpath("source_base.txt").read_text().strip()
          source_host = urlsplit(source_base).netloc.casefold()
          rule_path = re.compile(r"^List/(domainset|non_ip|ip)/[^/]+\.conf$")


          class RuleIndexParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.files = set()

              def handle_starttag(self, tag, attrs):
                  if tag.casefold() != "a":
                      return

                  href = dict(attrs).get("href", "").strip()
                  parsed = urlsplit(href)

                  if parsed.netloc and parsed.netloc.casefold() != source_host:
                      return

                  path = unquote(parsed.path).lstrip("/")
                  if rule_path.fullmatch(path):
                      self.files.add(path)


          parser = RuleIndexParser()
          html = root.joinpath("index.html").read_text(
              encoding="utf-8", errors="replace"
          )
          parser.feed(html)

          # Fallback for future HTML renderers that do not use normal anchors.
          if not parser.files:
              parser.files.update(
                  re.findall(r"List/(?:domainset|non_ip|ip)/[^\"<>\s]+\.conf", html)
              )

          files = sorted(parser.files)
          counts = Counter(path.split("/", 2)[1] for path in files)
          root.joinpath("files.txt").write_text(
              "".join(f"{item}\n" for item in files), encoding="utf-8"
          )

          print("Sukka List source files:")
          for category in ("domainset", "non_ip", "ip"):
              print(f"  {category:10s} {counts[category]}")
          print(f"  {'total':10s} {len(files)}")

          if len(files) < int(os.environ["MIN_TOTAL_RULES"]):
              raise SystemExit("ERROR: Too few upstream source files were found.")

          if any(counts[category] == 0 for category in ("domainset", "non_ip", "ip")):
              raise SystemExit("ERROR: At least one upstream category is missing.")
          PY

      - name: Download source rules concurrently and atomically
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail

          python3 <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          import os
          import time

          root = Path(os.environ["WORK_ROOT"])
          source_base = root.joinpath("source_base.txt").read_text().strip()
          files = root.joinpath("files.txt").read_text().splitlines()
          workers = max(1, min(int(os.environ["DOWNLOAD_WORKERS"]), 12))
          max_bytes = int(os.environ.get("MAX_SOURCE_FILE_MB", "40")) * 1024 * 1024


          def download(relative):
              destination = root / "source" / relative.removeprefix("List/")
              temporary = destination.with_suffix(destination.suffix + ".part")
              destination.parent.mkdir(parents=True, exist_ok=True)
              request = Request(
                  f"{source_base}/{relative}",
                  headers={"User-Agent": "Egern-Sukka-Sync/1.3.0"},
              )
              last_error = None

              for attempt in range(1, 6):
                  try:
                      with urlopen(request, timeout=90) as response:
                          content_type = response.headers.get("Content-Type", "").casefold()
                          if "text/html" in content_type:
                              raise ValueError("upstream returned HTML instead of a rule file")

                          content_length = response.headers.get("Content-Length", "")
                          if content_length.isdigit() and int(content_length) > max_bytes:
                              raise ValueError("upstream file exceeds the configured size limit")

                          content = response.read(max_bytes + 1)

                      if not content:
                          raise ValueError("upstream file is empty")
                      if len(content) > max_bytes:
                          raise ValueError("upstream file exceeds the configured size limit")

                      prefix = content[:1024].lstrip().lower()
                      if prefix.startswith((b"<!doctype html", b"<html")):
                          raise ValueError("upstream response contains an HTML error page")

                      temporary.write_bytes(content)
                      temporary.replace(destination)
                      return relative, len(content)
                  except Exception as exc:
                      temporary.unlink(missing_ok=True)
                      last_error = exc
                      if isinstance(exc, HTTPError) and exc.code not in {
                          408, 425, 429, 500, 502, 503, 504
                      }:
                          break
                      if attempt < 5:
                          time.sleep(min(2 ** attempt, 12))

              raise RuntimeError(f"{relative}: {last_error}")


          failures = []
          total_bytes = 0

          with ThreadPoolExecutor(max_workers=workers) as executor:
              tasks = {executor.submit(download, item): item for item in files}

              for task in as_completed(tasks):
                  try:
                      name, size = task.result()
                      total_bytes += size
                      print(f"OK {name} ({size:,} bytes)")
                  except Exception as exc:
                      failures.append(str(exc))
                      print(f"ERROR {exc}")

          if failures:
              raise SystemExit(
                  "ERROR: One or more upstream files could not be downloaded:\n"
                  + "\n".join(failures)
              )

          print(f"Downloaded {len(files)} files; {total_bytes:,} bytes.")
          PY

      - name: Remove Sukka markers before rule conversion
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail

          python3 <<'PY'
          from collections import Counter
          from pathlib import Path
          import hashlib
          import json
          import os
          import re

          root = Path(os.environ["WORK_ROOT"])
          source_root = root / "source"
          clean_root = root / "clean"

          marker_domain = "7h15.ru1353t.1s.m4d3.by.5ukk4w.skk.moe"
          marker_keyword = re.compile(
              r"^this[_-]?rule[_-]?set[_-]?is[_-]?made[_-]?by[_-]?sukkaw?$",
              flags=re.IGNORECASE,
          )
          domain_rule_types = {
              "DOMAIN", "DOMAIN-SUFFIX", "DOMAIN-KEYWORD", "DOMAIN-WILDCARD"
          }
          removed_by_category = Counter()
          removed_by_kind = Counter()
          records = []
          missing_markers = []
          source_manifest = []


          def classify_marker(raw_line):
              line = raw_line.lstrip("\ufeff").strip()
              if not line or line.startswith(("#", ";", "//")):
                  return None

              parts = line.split(",", 2)
              if len(parts) == 1:
                  candidate = parts[0].strip().strip("\"'")
              else:
                  rule_type = parts[0].strip().upper()
                  if rule_type not in domain_rule_types:
                      return None
                  candidate = parts[1].strip().strip("\"'")

              normalized = candidate.casefold().rstrip(".")
              while normalized.startswith((".", "*.", "+.")):
                  if normalized.startswith(("*.", "+.")):
                      normalized = normalized[2:]
                  else:
                      normalized = normalized[1:]

              if normalized == marker_domain or normalized.endswith("." + marker_domain):
                  return "domain_marker"

              if marker_keyword.fullmatch(normalized):
                  return "keyword_marker"

              return None


          for source in sorted(source_root.rglob("*.conf")):
              relative = source.relative_to(source_root)
              category = relative.parts[0]
              raw_content = source.read_bytes()
              text = raw_content.decode("utf-8-sig", errors="replace")
              upstream_hash_match = re.search(
                  r"\$content-hash-v1\$\s*:\s*([^\s$]+)", text
              )
              source_manifest.append(
                  {
                      "source": f"List/{relative.as_posix()}",
                      "bytes": len(raw_content),
                      "sha256": hashlib.sha256(raw_content).hexdigest(),
                      "upstream_content_hash": (
                          upstream_hash_match.group(1) if upstream_hash_match else None
                      ),
                  }
              )
              clean_lines = []
              file_records = []

              for line_number, line in enumerate(text.splitlines(), start=1):
                  kind = classify_marker(line)
                  if kind is None:
                      clean_lines.append(line)
                      continue

                  removed_by_category[category] += 1
                  removed_by_kind[kind] += 1
                  file_records.append({"line": line_number, "kind": kind})
                  # Preserve original line numbers for later audit diagnostics.
                  clean_lines.append("")

              destination = clean_root / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(
                  "\n".join(clean_lines) + "\n", encoding="utf-8"
              )

              if file_records:
                  records.append(
                      {
                          "file": relative.as_posix(),
                          "removed": len(file_records),
                          "markers": file_records,
                      }
                  )
              else:
                  active_lines = [
                      line.strip()
                      for line in clean_lines
                      if line.strip() and not line.strip().startswith(("#", ";", "//"))
                  ]
                  if active_lines:
                      missing_markers.append(relative.as_posix())

          audit = {
              "domain_marker": marker_domain,
              "keyword_marker_pattern": marker_keyword.pattern,
              "source_files": len(list(source_root.rglob("*.conf"))),
              "marker_files": len(records),
              "removed_total": sum(removed_by_category.values()),
              "removed_by_category": dict(sorted(removed_by_category.items())),
              "removed_by_kind": dict(sorted(removed_by_kind.items())),
              "files_without_marker": missing_markers,
              "records": records,
          }
          root.joinpath("marker_audit.json").write_text(
              json.dumps(audit, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          build_path = root / "index_build.txt"
          manifest = {
              "converter_version": "V1.3.0",
              "upstream_build": (
                  build_path.read_text(encoding="utf-8").strip()
                  if build_path.is_file()
                  else ""
              ),
              "upstream_url": (
                  root.joinpath("source_base.txt").read_text().strip()
                  if root.joinpath("source_base.txt").is_file()
                  else "https://ruleset.skk.moe"
              ),
              "source_files": sorted(source_manifest, key=lambda item: item["source"]),
          }
          root.joinpath("SOURCE_MANIFEST.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"Marker-bearing files: {audit['marker_files']}")
          print(f"Removed marker rules: {audit['removed_total']}")
          for category, count in audit["removed_by_category"].items():
              print(f"  {category:10s} {count}")
          for kind, count in audit["removed_by_kind"].items():
              print(f"  {kind:16s} {count}")

          if missing_markers:
              print("Active files without a known marker: " + ", ".join(missing_markers))
          PY

      - name: Convert clean List rules to native Egern YAML
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail

          python3 <<'PY'
          from collections import Counter
          from pathlib import Path
          import ipaddress
          import json
          import os
          import re

          VERSION = "V1.3.0"
          root = Path(os.environ["WORK_ROOT"])
          source_root = root / "clean"
          output_root = root / "output"
          marker_domain = "7h15.ru1353t.1s.m4d3.by.5ukk4w.skk.moe"
          domain_compression = (
              os.environ.get("ENABLE_DOMAIN_SEMANTIC_COMPRESSION", "true").casefold()
              == "true"
          )
          cidr_compression = (
              os.environ.get("ENABLE_CIDR_SEMANTIC_COMPRESSION", "true").casefold()
              == "true"
          )

          TYPE_MAP = {
              "DOMAIN": "domain_set",
              "DOMAIN-SUFFIX": "domain_suffix_set",
              "DOMAIN-KEYWORD": "domain_keyword_set",
              "DOMAIN-REGEX": "domain_regex_set",
              "DOMAIN-WILDCARD": "domain_wildcard_set",
              "IP-CIDR": "ip_cidr_set",
              "IP-CIDR6": "ip_cidr6_set",
              "IP-ASN": "asn_set",
              "ASN": "asn_set",
              "GEOIP": "geoip_set",
              "URL-REGEX": "url_regex_set",
              "USER-AGENT": "user_agent_set",
              "DEST-PORT": "dest_port_set",
              "DST-PORT": "dest_port_set",
              "PROTOCOL": "protocol_set",
              "SSID": "ssid_set",
              "BSSID": "bssid_set",
              "CELLULAR": "cellular_set",
          }
          OUTPUT_ORDER = (
              "domain_set",
              "domain_suffix_set",
              "domain_keyword_set",
              "domain_regex_set",
              "domain_wildcard_set",
              "geoip_set",
              "ip_cidr_set",
              "ip_cidr6_set",
              "asn_set",
              "url_regex_set",
              "user_agent_set",
              "dest_port_set",
              "protocol_set",
              "ssid_set",
              "bssid_set",
              "cellular_set",
          )
          IP_TYPES = {"IP-CIDR", "IP-CIDR6", "IP-ASN", "ASN", "GEOIP"}
          DOMAIN_KEYS = {"domain_set", "domain_suffix_set", "domain_wildcard_set"}
          IP_KEYS = {"geoip_set", "ip_cidr_set", "ip_cidr6_set", "asn_set"}

          stats = Counter()
          generated_by_category = Counter()
          skipped_files = []
          unsupported_rules = []
          invalid_rules = []
          no_resolve_files = []
          mixed_files = []
          category_warnings = []


          def is_deprecated(text):
              comments = [
                  line.lstrip("# ").strip().casefold()
                  for line in text.splitlines()
                  if line.lstrip().startswith("#")
              ]
              has_deprecated_title = any(
                  re.search(r"(?:ruleset|rule\s*set)\s*-\s*deprecated\b", line)
                  for line in comments
              )
              has_merge_notice = any(
                  re.search(r"\b(?:this\s+file\s+)?has\s+been\s+merged\s+(?:with|into)\b", line)
                  for line in comments
              )
              has_active_rule = any(
                  line.strip() and not line.strip().startswith(("#", ";", "//"))
                  for line in text.splitlines()
              )
              return (has_deprecated_title or has_merge_notice) and not has_active_rule


          def normalize_value(field, value):
              value = value.strip()
              if not value:
                  raise ValueError("empty rule value")

              if field == "domain_suffix_set":
                  value = value.lstrip(".").rstrip(".").casefold()
              elif field in {"domain_set", "domain_wildcard_set"}:
                  value = value.rstrip(".").casefold()
              elif field == "geoip_set":
                  value = value.upper()
              elif field == "protocol_set":
                  value = value.casefold()
              elif field in {"ip_cidr_set", "ip_cidr6_set"}:
                  network = ipaddress.ip_network(value, strict=False)
                  expected = 4 if field == "ip_cidr_set" else 6
                  if network.version != expected:
                      raise ValueError(f"expected IPv{expected} CIDR")
                  value = str(network)

              if not value:
                  raise ValueError("empty normalized rule value")

              return value


          def dedup_key(field, value):
              if field in DOMAIN_KEYS or field in {"geoip_set", "protocol_set"}:
                  return value.casefold()
              if field == "asn_set":
                  match = re.fullmatch(r"(?:AS)?(\d+)", value, re.IGNORECASE)
                  return match.group(1) if match else value.casefold()
              return value


          def add_rule(groups, field, value, *, count_duplicates=True):
              bucket = groups.setdefault(field, {})
              key = dedup_key(field, value)
              if key in bucket:
                  if count_duplicates:
                      stats["duplicates_removed"] += 1
                  return False
              bucket[key] = value
              return True


          def domain_covered_by_suffix(domain, suffixes):
              labels = domain.casefold().rstrip(".").split(".")
              return any(".".join(labels[index:]) in suffixes for index in range(len(labels)))


          def optimize_domain_rules(groups):
              if not domain_compression:
                  return

              suffix_bucket = groups.get("domain_suffix_set", {})
              if not suffix_bucket:
                  return

              candidates = sorted(
                  suffix_bucket.values(),
                  key=lambda value: (value.count("."), value),
              )
              kept_suffixes = set()

              for value in candidates:
                  if domain_covered_by_suffix(value, kept_suffixes):
                      stats["domain_suffixes_pruned"] += 1
                  else:
                      kept_suffixes.add(value)

              groups["domain_suffix_set"] = {
                  key: value
                  for key, value in suffix_bucket.items()
                  if value in kept_suffixes
              }

              exact_bucket = groups.get("domain_set", {})
              if exact_bucket:
                  optimized = {}
                  for key, value in exact_bucket.items():
                      if domain_covered_by_suffix(value, kept_suffixes):
                          stats["exact_domains_pruned"] += 1
                      else:
                          optimized[key] = value
                  if optimized:
                      groups["domain_set"] = optimized
                  else:
                      groups.pop("domain_set", None)


          def optimize_ip_rules(groups):
              if not cidr_compression:
                  return

              for field, counter_key in (
                  ("ip_cidr_set", "ipv4_networks_pruned"),
                  ("ip_cidr6_set", "ipv6_networks_pruned"),
              ):
                  bucket = groups.get(field, {})
                  if len(bucket) < 2:
                      continue

                  networks = [ipaddress.ip_network(value) for value in bucket.values()]
                  collapsed = list(ipaddress.collapse_addresses(networks))
                  removed = len(networks) - len(collapsed)

                  if removed > 0:
                      stats[counter_key] += removed
                      groups[field] = {
                          str(network): str(network) for network in collapsed
                      }


          def rebuild_combined_ip_rules(combined, no_resolve_ip, resolving_ip):
              for field in IP_KEYS:
                  combined.pop(field, None)

              for group in (no_resolve_ip, resolving_ip):
                  for field, values in group.items():
                      for value in values.values():
                          add_rule(combined, field, value, count_duplicates=False)


          def copy_non_ip_rules(source, destination):
              for field, values in source.items():
                  if field not in IP_KEYS:
                      for value in values.values():
                          add_rule(destination, field, value, count_duplicates=False)


          def write_yaml(destination, groups, source_relative, *, no_resolve=False):
              if not any(groups.get(field) for field in OUTPUT_ORDER):
                  return False

              destination.parent.mkdir(parents=True, exist_ok=True)
              upstream_path = f"List/{source_relative.as_posix()}"
              license_name = (
                  "CC BY-SA 2.0"
                  if upstream_path == "List/ip/china_ip.conf"
                  else "AGPL-3.0"
              )

              with destination.open("w", encoding="utf-8", newline="\n") as handle:
                  handle.write("# Upstream: Sukka Ruleset by Sukka (@SukkaW)\n")
                  handle.write(f"# Source: https://ruleset.skk.moe/{upstream_path}\n")
                  handle.write(f"# Upstream license: {license_name}\n\n")

                  if no_resolve:
                      handle.write("no_resolve: true\n\n")

                  for field in OUTPUT_ORDER:
                      values = groups.get(field)
                      if not values:
                          continue

                      handle.write(f"{field}:\n")
                      for value in values.values():
                          quoted = json.dumps(value, ensure_ascii=False)
                          handle.write(f"  - {quoted}\n")
                      handle.write("\n")

              stats["generated"] += 1
              generated_by_category[destination.relative_to(output_root).parts[0]] += 1
              return True


          def register_empty(category, source):
              stats["empty"] += 1
              skipped_files.append(f"EMPTY: {category}/{source.name}")


          def active_lines(text):
              for line_number, raw in enumerate(text.splitlines(), start=1):
                  line = raw.strip()
                  if line and not line.startswith(("#", ";", "//")):
                      yield line_number, line


          def convert_domainset(source):
              relative = source.relative_to(source_root)
              destination = output_root / "domain" / f"{source.stem}.yaml"
              text = source.read_text(encoding="utf-8", errors="replace")

              if is_deprecated(text):
                  stats["deprecated"] += 1
                  skipped_files.append(f"DEPRECATED: {relative.as_posix()}")
                  return

              groups = {}
              for line_number, line in active_lines(text):
                  if "," in line:
                      stats["unsupported"] += 1
                      unsupported_rules.append(
                          f"{relative.as_posix()}:{line_number}: {line}"
                      )
                      continue

                  field = "domain_suffix_set" if line.startswith(".") else "domain_set"
                  try:
                      value = normalize_value(field, line)
                  except ValueError as exc:
                      stats["invalid"] += 1
                      invalid_rules.append(
                          f"{relative.as_posix()}:{line_number}: {exc}: {line}"
                      )
                      continue

                  add_rule(groups, field, value)
                  stats["source_rule_lines"] += 1

              optimize_domain_rules(groups)

              if not write_yaml(destination, groups, relative):
                  register_empty("domainset", source)


          def convert_standard(source, category):
              relative = source.relative_to(source_root)
              destination = output_root / category / f"{source.stem}.yaml"
              text = source.read_text(encoding="utf-8", errors="replace")

              if is_deprecated(text):
                  stats["deprecated"] += 1
                  skipped_files.append(f"DEPRECATED: {relative.as_posix()}")
                  return

              combined = {}
              resolving_ip = {}
              no_resolve_ip = {}

              for line_number, line in active_lines(text):
                  if "," not in line:
                      stats["unsupported"] += 1
                      unsupported_rules.append(
                          f"{relative.as_posix()}:{line_number}: {line}"
                      )
                      continue

                  rule_type, raw_value = line.split(",", 1)
                  rule_type = rule_type.strip().upper()
                  field = TYPE_MAP.get(rule_type)

                  if field is None:
                      stats["unsupported"] += 1
                      unsupported_rules.append(
                          f"{relative.as_posix()}:{line_number}: {line}"
                      )
                      continue

                  flags = []
                  value = raw_value.strip()

                  if rule_type in IP_TYPES:
                      parts = [item.strip() for item in raw_value.split(",")]
                      value = parts[0]
                      flags = [item.casefold().replace("_", "-") for item in parts[1:]]
                      unknown_flags = [item for item in flags if item != "no-resolve"]

                      if unknown_flags:
                          stats["unsupported"] += 1
                          unsupported_rules.append(
                              f"{relative.as_posix()}:{line_number}: "
                              f"unsupported flags {unknown_flags}: {line}"
                          )
                          continue

                  try:
                      value = normalize_value(field, value)
                  except ValueError as exc:
                      stats["invalid"] += 1
                      invalid_rules.append(
                          f"{relative.as_posix()}:{line_number}: {exc}: {line}"
                      )
                      continue

                  if marker_domain in value.casefold():
                      raise RuntimeError(
                          f"Marker survived pre-conversion cleaning: "
                          f"{relative.as_posix()}:{line_number}"
                      )

                  add_rule(combined, field, value)
                  stats["source_rule_lines"] += 1

                  if rule_type in IP_TYPES:
                      target = no_resolve_ip if "no-resolve" in flags else resolving_ip
                      add_rule(target, field, value, count_duplicates=False)

              optimize_domain_rules(combined)
              optimize_ip_rules(no_resolve_ip)
              optimize_ip_rules(resolving_ip)
              rebuild_combined_ip_rules(combined, no_resolve_ip, resolving_ip)

              has_real_domains = any(
                  combined.get(field)
                  for field in (
                      "domain_set",
                      "domain_suffix_set",
                      "domain_keyword_set",
                      "domain_regex_set",
                      "domain_wildcard_set",
                  )
              )
              has_ip_rules = any(combined.get(field) for field in IP_KEYS)

              if category == "non_ip" and has_ip_rules:
                  category_warnings.append(
                      f"NON_IP_CONTAINS_IP: {relative.as_posix()}"
                  )
              if category == "ip" and has_real_domains:
                  category_warnings.append(
                      f"IP_CONTAINS_DOMAIN: {relative.as_posix()}"
                  )

              has_no_resolve_ip = any(no_resolve_ip.values())
              has_resolving_ip = any(resolving_ip.values())

              # The historical filename remains compatible with V1.1.3.
              # Egern applies no_resolve to every IP rule in one ruleset.
              if not write_yaml(
                  destination,
                  combined,
                  relative,
                  no_resolve=has_no_resolve_ip,
              ):
                  register_empty(category, source)
                  return

              if has_no_resolve_ip:
                  no_resolve_files.append(destination.relative_to(output_root).as_posix())

              if has_no_resolve_ip and has_resolving_ip:
                  # Companion files preserve per-rule DNS semantics exactly.
                  # Place optional non-IP rules before all strict IP companions.
                  resolve_groups = {}
                  for field, values in resolving_ip.items():
                      for value in values.values():
                          add_rule(resolve_groups, field, value, count_duplicates=False)

                  non_ip_groups = {}
                  copy_non_ip_rules(combined, non_ip_groups)
                  strict_non_ip = None
                  if any(non_ip_groups.values()):
                      strict_non_ip = destination.with_name(
                          f"{source.stem}.non_ip.yaml"
                      )
                      write_yaml(strict_non_ip, non_ip_groups, relative, no_resolve=False)

                  strict_no_resolve = destination.with_name(
                      f"{source.stem}.no_resolve.yaml"
                  )
                  strict_resolve = destination.with_name(f"{source.stem}.resolve.yaml")

                  write_yaml(
                      strict_no_resolve,
                      no_resolve_ip,
                      relative,
                      no_resolve=True,
                  )
                  write_yaml(strict_resolve, resolve_groups, relative, no_resolve=False)
                  no_resolve_files.append(
                      strict_no_resolve.relative_to(output_root).as_posix()
                  )
                  stats["mixed_no_resolve_files"] += 1
                  stats["strict_companion_files"] += 2 + (1 if strict_non_ip else 0)
                  mixed_files.append(
                      {
                          "source": relative.as_posix(),
                          "compatibility": destination.relative_to(output_root).as_posix(),
                          "strict_non_ip": (
                              strict_non_ip.relative_to(output_root).as_posix()
                              if strict_non_ip
                              else None
                          ),
                          "strict_no_resolve": strict_no_resolve.relative_to(
                              output_root
                          ).as_posix(),
                          "strict_resolve": strict_resolve.relative_to(output_root).as_posix(),
                          "no_resolve_rules": sum(
                              len(values) for values in no_resolve_ip.values()
                          ),
                          "resolve_rules": sum(
                              len(values) for values in resolving_ip.values()
                          ),
                      }
                  )


          for source in sorted((source_root / "domainset").glob("*.conf")):
              convert_domainset(source)

          for category in ("non_ip", "ip"):
              for source in sorted((source_root / category).glob("*.conf")):
                  convert_standard(source, category)

          stats["no_resolve_files"] = len(no_resolve_files)
          total_active_rules = (
              stats["source_rule_lines"] + stats["unsupported"] + stats["invalid"]
          )
          conversion_coverage = (
              stats["source_rule_lines"] * 100.0 / total_active_rules
              if total_active_rules
              else 0.0
          )

          if stats["invalid"] and (
              os.environ.get("FAIL_ON_INVALID_RULES", "true").casefold() == "true"
          ):
              raise SystemExit(
                  "ERROR: Invalid source rules detected:\n" + "\n".join(invalid_rules[:20])
              )

          if stats["unsupported"] and (
              os.environ.get("FAIL_ON_UNSUPPORTED_RULES", "false").casefold() == "true"
          ):
              raise SystemExit(
                  "ERROR: Unsupported source rules detected:\n"
                  + "\n".join(unsupported_rules[:20])
              )

          if conversion_coverage < float(
              os.environ.get("MIN_CONVERSION_COVERAGE", "99.0")
          ):
              raise SystemExit(
                  f"ERROR: Conversion coverage too low: {conversion_coverage:.4f}%"
              )

          if category_warnings and (
              os.environ.get("STRICT_CATEGORY_VALIDATION", "false").casefold() == "true"
          ):
              raise SystemExit(
                  "ERROR: Rule category violations:\n" + "\n".join(category_warnings)
              )

          if stats["generated"] == 0:
              raise SystemExit("ERROR: No Egern rulesets were generated.")

          marker_audit = json.loads(root.joinpath("marker_audit.json").read_text())
          report = {
              "version": VERSION,
              "stats": dict(stats),
              "conversion_coverage_percent": round(conversion_coverage, 6),
              "generated_by_category": dict(sorted(generated_by_category.items())),
              "marker_audit": marker_audit,
              "no_resolve_files": sorted(no_resolve_files),
              "mixed_no_resolve_files": mixed_files,
              "skipped_files": skipped_files,
              "unsupported_rules": unsupported_rules,
              "invalid_rules": invalid_rules,
              "category_warnings": category_warnings,
          }
          root.joinpath("conversion_audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"Sukka -> Egern {VERSION}")
          print(f"  Generated rulesets:    {stats['generated']}")
          print(f"  Clean source rules:    {stats['source_rule_lines']}")
          print(f"  Removed markers:       {marker_audit['removed_total']}")
          print(f"  Removed duplicates:    {stats['duplicates_removed']}")
          print(f"  Covered domain suffix: {stats['domain_suffixes_pruned']}")
          print(f"  Covered exact domains: {stats['exact_domains_pruned']}")
          print(f"  Merged IPv4 networks:  {stats['ipv4_networks_pruned']}")
          print(f"  Merged IPv6 networks:  {stats['ipv6_networks_pruned']}")
          print(f"  Conversion coverage:   {conversion_coverage:.4f}%")
          print(f"  no_resolve files:      {stats['no_resolve_files']}")
          print(f"  Mixed semantic files:  {stats['mixed_no_resolve_files']}")
          print(f"  Strict companion files:{stats['strict_companion_files']}")
          print(f"  Deprecated files:      {stats['deprecated']}")
          print(f"  Empty files:           {stats['empty']}")
          print(f"  Unsupported lines:     {stats['unsupported']}")
          print(f"  Invalid lines:         {stats['invalid']}")
          print(f"  Category warnings:     {len(category_warnings)}")

          for item in mixed_files:
              print(
                  f"MIXED {item['source']}: "
                  f"{item['no_resolve_rules']} no-resolve / "
                  f"{item['resolve_rules']} normal"
              )
          PY

      - name: Install YAML validator
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'PyYAML>=6,<7'

      - name: Build iOS Lite rules and strict Egern configuration fragments
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail

          python3 <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          import os
          import yaml

          root = Path(os.environ["WORK_ROOT"])
          output = root / "output"
          lite_root = output / "lite"
          fragments_root = root / "fragments"
          audit_path = root / "conversion_audit.json"
          audit = json.loads(audit_path.read_text(encoding="utf-8"))
          loader = getattr(yaml, "CSafeLoader", yaml.SafeLoader)
          enabled = os.environ.get("ENABLE_IOS_LITE", "true").casefold() == "true"
          max_rules = int(os.environ.get("IOS_MAX_RULES_PER_SET", "25000"))
          exclude_large = (
              os.environ.get("IOS_EXCLUDE_LARGE_REJECT", "true").casefold() == "true"
          )
          exclude_extra = (
              os.environ.get("IOS_EXCLUDE_REJECT_EXTRA", "true").casefold() == "true"
          )
          exclude_phishing = (
              os.environ.get("IOS_EXCLUDE_REJECT_PHISHING", "true").casefold() == "true"
          )
          exclude_url_regex = (
              os.environ.get("IOS_EXCLUDE_URL_REGEX", "true").casefold() == "true"
          )
          repository = os.environ.get(
              "GITHUB_REPOSITORY", "locksherneo/egern-sukka-rules"
          )
          default_branch = os.environ.get("DEFAULT_BRANCH", "main") or "main"
          raw_base = (
              f"https://raw.githubusercontent.com/{repository}/{default_branch}"
          )
          excluded_files = []
          modified_files = []
          lite_counts = Counter()
          lite_total_rules = 0


          def exclusion_reason(relative):
              path = relative.as_posix()
              if exclude_large and path == "domain/reject.yaml":
                  return "large_base_ad_block_list"
              if exclude_extra and path == "domain/reject_extra.yaml":
                  return "large_extra_ad_block_list"
              if exclude_phishing and path == "domain/reject_phishing.yaml":
                  return "large_phishing_list"
              if exclude_url_regex and path == "non_ip/reject-url-regex.yaml":
                  return "high_cost_url_regex_ruleset"
              return None


          def write_lite_yaml(destination, source, data):
              destination.parent.mkdir(parents=True, exist_ok=True)
              original_lines = source.read_text(encoding="utf-8").splitlines()
              headers = []
              for line in original_lines:
                  if line.startswith("#"):
                      headers.append(line)
                  elif line.strip():
                      break

              with destination.open("w", encoding="utf-8", newline="\n") as handle:
                  for header in headers:
                      handle.write(header + "\n")
                  handle.write("# Profile: Egern iOS Lite\n\n")

                  if data.get("no_resolve") is True:
                      handle.write("no_resolve: true\n\n")

                  for field, values in data.items():
                      if field == "no_resolve":
                          continue
                      handle.write(f"{field}:\n")
                      for value in values:
                          handle.write(
                              f"  - {json.dumps(value, ensure_ascii=False)}\n"
                          )
                      handle.write("\n")


          if enabled:
              for category in ("domain", "non_ip", "ip"):
                  for source in sorted((output / category).glob("*.yaml")):
                      relative = source.relative_to(output)
                      reason = exclusion_reason(relative)
                      if reason:
                          excluded_files.append(
                              {"file": relative.as_posix(), "reason": reason}
                          )
                          continue

                      data = yaml.load(
                          source.read_text(encoding="utf-8"), Loader=loader
                      )
                      if exclude_url_regex and "url_regex_set" in data:
                          removed = len(data.pop("url_regex_set"))
                          modified_files.append(
                              {
                                  "file": relative.as_posix(),
                                  "reason": "url_regex_removed",
                                  "removed_rules": removed,
                              }
                          )

                      rule_count = sum(
                          len(values)
                          for field, values in data.items()
                          if field != "no_resolve"
                      )

                      if rule_count == 0:
                          excluded_files.append(
                              {
                                  "file": relative.as_posix(),
                                  "reason": "empty_after_ios_filtering",
                              }
                          )
                          continue

                      if rule_count > max_rules:
                          excluded_files.append(
                              {
                                  "file": relative.as_posix(),
                                  "reason": "exceeds_ios_rule_count_limit",
                                  "rule_count": rule_count,
                              }
                          )
                          continue

                      destination = lite_root / relative
                      write_lite_yaml(destination, source, data)
                      lite_counts[category] += 1
                      lite_total_rules += rule_count


          def infer_policy(relative):
              stem = Path(relative).name.split(".", 1)[0].casefold()
              if stem.startswith("reject"):
                  return "REJECT"
              if stem in {"apple_cdn", "china_ip", "china_ip_ipv6", "direct", "domestic", "lan"}:
                  return "DIRECT"
              return "YOUR_POLICY"


          def append_rule(lines, relative, policy):
              lines.extend(
                  [
                      "  - rule_set:",
                      f'      match: "{raw_base}/{relative}"',
                      f'      policy: "{policy}"',
                      "      update_interval: 86400",
                  ]
              )


          strict_lines = [
              "# Egern strict DNS semantics fragment; replace YOUR_POLICY as needed.",
              "rules:",
          ]
          for mixed in audit["mixed_no_resolve_files"]:
              policy = infer_policy(mixed["compatibility"])
              if mixed.get("strict_non_ip"):
                  append_rule(strict_lines, mixed["strict_non_ip"], policy)
              append_rule(strict_lines, mixed["strict_no_resolve"], policy)
              append_rule(strict_lines, mixed["strict_resolve"], policy)

          if len(strict_lines) == 2:
              strict_lines = [
                  "# No mixed no_resolve rulesets were found in this upstream build.",
                  "rules: []",
              ]

          lite_lines = [
              "# Egern iOS Lite fragment; replace YOUR_POLICY with an existing group.",
              "# Order: domain rules, non-IP rules, then IP rules.",
              "rules:",
          ]
          featured_non_ip = (
              "domain/apple_cdn.yaml",
              "domain/cdn.yaml",
              "domain/reject_sukka.yaml",
              "non_ip/reject.yaml",
              "non_ip/ai.yaml",
              "non_ip/apple_services.yaml",
              "non_ip/microsoft.yaml",
              "non_ip/stream.yaml",
              "non_ip/telegram.yaml",
          )
          featured_ip = (
              "ip/ai.yaml",
              "ip/apple_services.yaml",
              "ip/telegram.yaml",
              "ip/lan.yaml",
          )

          for relative in featured_non_ip:
              if (lite_root / relative).is_file():
                  append_rule(lite_lines, f"lite/{relative}", infer_policy(relative))

          for mixed in audit["mixed_no_resolve_files"]:
              shared_non_ip = mixed.get("strict_non_ip")
              if shared_non_ip and (lite_root / shared_non_ip).is_file():
                  append_rule(
                      lite_lines,
                      f"lite/{shared_non_ip}",
                      infer_policy(mixed["compatibility"]),
                  )

          for relative in featured_ip:
              if (lite_root / relative).is_file():
                  append_rule(lite_lines, f"lite/{relative}", infer_policy(relative))

          for mixed in audit["mixed_no_resolve_files"]:
              no_resolve = mixed["strict_no_resolve"]
              resolving = mixed["strict_resolve"]
              if (lite_root / no_resolve).is_file() and (lite_root / resolving).is_file():
                  policy = infer_policy(mixed["compatibility"])
                  append_rule(lite_lines, f"lite/{no_resolve}", policy)
                  append_rule(lite_lines, f"lite/{resolving}", policy)

          if len(lite_lines) == 3:
              lite_lines = ["# No eligible iOS Lite rules were generated.", "rules: []"]

          fragments_root.joinpath("EGERN_RULES_STRICT.yaml").write_text(
              "\n".join(strict_lines) + "\n", encoding="utf-8"
          )
          fragments_root.joinpath("EGERN_RULES_IOS_LITE.yaml").write_text(
              "\n".join(lite_lines) + "\n", encoding="utf-8"
          )

          audit["ios_lite"] = {
              "enabled": enabled,
              "generated_rulesets": sum(lite_counts.values()),
              "generated_by_category": dict(sorted(lite_counts.items())),
              "total_rules": lite_total_rules,
              "max_rules_per_set": max_rules,
              "excluded_files": excluded_files,
              "modified_files": modified_files,
          }
          audit["default_branch"] = default_branch
          audit_path.write_text(
              json.dumps(audit, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"iOS Lite enabled: {enabled}")
          print(f"iOS Lite rulesets: {sum(lite_counts.values())}")
          print(f"iOS Lite total rules: {lite_total_rules}")
          print(f"iOS Lite exclusions: {len(excluded_files)}")
          print(f"iOS Lite regex-filtered files: {len(modified_files)}")
          print(f"Repository default branch: {default_branch}")
          PY

      - name: Validate YAML, markers, deduplication and DNS semantics
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail

          python3 <<'PY'
          from collections import Counter
          from pathlib import Path
          import ipaddress
          import json
          import os
          import re
          import yaml

          root = Path(os.environ["WORK_ROOT"])
          output = root / "output"
          audit = json.loads(root.joinpath("conversion_audit.json").read_text())
          yaml_loader = getattr(yaml, "CSafeLoader", yaml.SafeLoader)
          marker = audit["marker_audit"]["domain_marker"].casefold()
          marker_keyword = re.compile(
              audit["marker_audit"]["keyword_marker_pattern"], re.IGNORECASE
          )

          allowed_keys = {
              "domain_set", "domain_suffix_set", "domain_keyword_set",
              "domain_regex_set", "domain_wildcard_set", "geoip_set",
              "ip_cidr_set", "ip_cidr6_set", "asn_set", "url_regex_set",
              "user_agent_set", "dest_port_set", "protocol_set", "ssid_set",
              "bssid_set", "cellular_set", "no_resolve",
          }
          ip_keys = {"geoip_set", "ip_cidr_set", "ip_cidr6_set", "asn_set"}
          full_counts = Counter()
          lite_counts = Counter()
          full_no_resolve_count = 0
          lite_no_resolve_count = 0

          for file in sorted(output.rglob("*.yaml")):
              relative = file.relative_to(output)
              is_lite = relative.parts[0] == "lite"
              category = relative.parts[1] if is_lite else relative.parts[0]
              data = yaml.load(file.read_text(encoding="utf-8"), Loader=yaml_loader)

              if not isinstance(data, dict) or not data:
                  raise RuntimeError(f"Invalid or empty YAML mapping: {file}")

              unknown = set(data) - allowed_keys
              if unknown:
                  raise RuntimeError(f"Unknown Egern fields in {file}: {sorted(unknown)}")

              if "no_resolve" in data:
                  if not isinstance(data["no_resolve"], bool):
                      raise RuntimeError(f"{file}: no_resolve must be a boolean")
                  if not any(data.get(key) for key in ip_keys):
                      raise RuntimeError(f"{file}: no_resolve exists without IP rules")
                  if data["no_resolve"]:
                      if is_lite:
                          lite_no_resolve_count += 1
                      else:
                          full_no_resolve_count += 1

              if is_lite and (
                  os.environ.get("IOS_EXCLUDE_URL_REGEX", "true").casefold() == "true"
              ) and "url_regex_set" in data:
                  raise RuntimeError(f"{file}: iOS Lite unexpectedly contains URL regex rules")

              for key, values in data.items():
                  if key == "no_resolve":
                      continue

                  if not isinstance(values, list) or not values:
                      raise RuntimeError(f"{file}: {key} must be a nonempty list")

                  seen = set()
                  for value in values:
                      if not isinstance(value, str) or not value.strip():
                          raise RuntimeError(f"{file}: {key} contains an invalid value")

                      folded = value.casefold()
                      if marker in folded or marker_keyword.fullmatch(folded):
                          raise RuntimeError(f"{file}: Sukka marker survived conversion")

                      dedup_value = folded if key in {
                          "domain_set", "domain_suffix_set", "domain_wildcard_set",
                          "geoip_set", "protocol_set",
                      } else value

                      if key == "asn_set":
                          match = re.fullmatch(r"(?:AS)?(\d+)", value, re.IGNORECASE)
                          dedup_value = match.group(1) if match else folded

                      if dedup_value in seen:
                          raise RuntimeError(f"{file}: duplicate in {key}: {value}")
                      seen.add(dedup_value)

                      if key in {"ip_cidr_set", "ip_cidr6_set"}:
                          network = ipaddress.ip_network(value, strict=True)
                          expected = 4 if key == "ip_cidr_set" else 6
                          if network.version != expected:
                              raise RuntimeError(f"{file}: {key} contains wrong IP version")

              if is_lite:
                  lite_counts[category] += 1
              else:
                  full_counts[category] += 1

          full_total = sum(full_counts.values())
          lite_total = sum(lite_counts.values())
          if full_total < int(os.environ["MIN_TOTAL_RULES"]):
              raise RuntimeError(f"Too few validated full Egern rulesets: {full_total}")

          if any(full_counts[category] == 0 for category in ("domain", "non_ip", "ip")):
              raise RuntimeError(
                  f"One or more full output categories are empty: {dict(full_counts)}"
              )

          if full_total != audit["stats"]["generated"]:
              raise RuntimeError("Generated ruleset count does not match the audit report")

          if full_no_resolve_count != audit["stats"]["no_resolve_files"]:
              raise RuntimeError("no_resolve file count does not match the audit report")

          if lite_total != audit["ios_lite"]["generated_rulesets"]:
              raise RuntimeError("iOS Lite ruleset count does not match the audit report")

          if audit["ios_lite"]["enabled"] and any(
              lite_counts[category] == 0 for category in ("domain", "non_ip", "ip")
          ):
              raise RuntimeError(
                  f"One or more iOS Lite categories are empty: {dict(lite_counts)}"
              )

          for mixed in audit["mixed_no_resolve_files"]:
              if mixed.get("strict_non_ip"):
                  strict_non_ip = yaml.load(
                      (output / mixed["strict_non_ip"]).read_text(encoding="utf-8"),
                      Loader=yaml_loader,
                  )
                  if "no_resolve" in strict_non_ip or any(
                      strict_non_ip.get(key) for key in ip_keys
                  ):
                      raise RuntimeError(
                          "Strict non-IP companion unexpectedly contains IP semantics"
                      )

              strict_no_resolve = yaml.load(
                  (output / mixed["strict_no_resolve"]).read_text(encoding="utf-8"),
                  Loader=yaml_loader,
              )
              strict_resolve = yaml.load(
                  (output / mixed["strict_resolve"]).read_text(encoding="utf-8"),
                  Loader=yaml_loader,
              )

              if strict_no_resolve.get("no_resolve") is not True:
                  raise RuntimeError("Strict no_resolve companion has incorrect DNS semantics")
              if "no_resolve" in strict_resolve:
                  raise RuntimeError("Strict resolving companion unexpectedly disables DNS")

          for fragment_name in ("EGERN_RULES_STRICT.yaml", "EGERN_RULES_IOS_LITE.yaml"):
              fragment = yaml.load(
                  (root / "fragments" / fragment_name).read_text(encoding="utf-8"),
                  Loader=yaml_loader,
              )
              if not isinstance(fragment, dict) or not isinstance(fragment.get("rules"), list):
                  raise RuntimeError(f"Invalid generated Egern configuration fragment: {fragment_name}")

          print(f"Validated {full_total} full native Egern YAML rulesets.")
          print(f"Validated {lite_total} iOS Lite Egern YAML rulesets.")
          print(f"Full categories: {dict(full_counts)}")
          print(f"iOS Lite categories: {dict(lite_counts)}")
          print(f"Full no_resolve=true files: {full_no_resolve_count}")
          print(f"iOS Lite no_resolve=true files: {lite_no_resolve_count}")
          print("Marker residue: 0; duplicate residue: 0.")
          PY

      - name: Prevent suspicious upstream shrinkage and critical rule loss
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import json
          import os

          root = Path(os.environ["WORK_ROOT"])
          output = root / "output"
          current = json.loads(
              root.joinpath("conversion_audit.json").read_text(encoding="utf-8")
          )
          previous_path = Path("CONVERSION_AUDIT.json")
          previous = {}
          if previous_path.is_file():
              try:
                  previous = json.loads(previous_path.read_text(encoding="utf-8"))
              except (ValueError, OSError) as exc:
                  raise SystemExit(f"ERROR: Existing conversion baseline is invalid: {exc}")

          old_files = int(previous.get("stats", {}).get("generated", 0))
          old_rules = int(previous.get("stats", {}).get("source_rule_lines", 0))
          new_files = int(current["stats"].get("generated", 0))
          new_rules = int(current["stats"].get("source_rule_lines", 0))
          max_file_drop = float(os.environ.get("MAX_FILE_DROP_PERCENT", "20"))
          max_rule_drop = float(os.environ.get("MAX_RULE_DROP_PERCENT", "25"))
          allow = os.environ.get("ALLOW_LARGE_CHANGES", "false").casefold() == "true"
          issues = []


          def drop_percent(previous_count, current_count):
              if previous_count <= 0:
                  return 0.0
              return max(0.0, (previous_count - current_count) * 100.0 / previous_count)


          file_drop = drop_percent(old_files, new_files)
          rule_drop = drop_percent(old_rules, new_rules)

          if old_files and file_drop > max_file_drop:
              issues.append(
                  f"Ruleset file count dropped {file_drop:.2f}% "
                  f"({old_files} -> {new_files}; limit {max_file_drop:.2f}%)"
              )

          if old_rules and rule_drop > max_rule_drop:
              issues.append(
                  f"Source rule count dropped {rule_drop:.2f}% "
                  f"({old_rules} -> {new_rules}; limit {max_rule_drop:.2f}%)"
              )

          previous_categories = previous.get("generated_by_category", {})
          current_categories = current.get("generated_by_category", {})
          for category in ("domain", "non_ip", "ip"):
              category_old = int(previous_categories.get(category, 0))
              category_new = int(current_categories.get(category, 0))
              category_drop = drop_percent(category_old, category_new)
              if category_old and category_drop > max_file_drop:
                  issues.append(
                      f"Category {category} dropped {category_drop:.2f}% "
                      f"({category_old} -> {category_new})"
                  )

          required = [
              item.strip()
              for item in os.environ.get("REQUIRED_RULESETS", "").split(",")
              if item.strip()
          ]
          missing = [item for item in required if not (output / item).is_file()]
          if missing:
              issues.append("Required rulesets are missing: " + ", ".join(missing))

          current["safety_guard"] = {
              "previous_files": old_files,
              "current_files": new_files,
              "previous_source_rules": old_rules,
              "current_source_rules": new_rules,
              "file_drop_percent": round(file_drop, 6),
              "rule_drop_percent": round(rule_drop, 6),
              "required_rulesets": required,
              "missing_rulesets": missing,
              "issues": issues,
              "manual_override": allow,
          }
          root.joinpath("conversion_audit.json").write_text(
              json.dumps(current, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"Full rulesets: {old_files or 'no baseline'} -> {new_files}")
          print(f"Source rules:  {old_rules or 'no baseline'} -> {new_rules}")
          print(f"Ruleset drop:  {file_drop:.2f}%")
          print(f"Source drop:   {rule_drop:.2f}%")
          print(f"Critical files checked: {len(required)}")

          if issues and not allow:
              raise SystemExit(
                  "ERROR: Safety guard blocked the update:\n"
                  + "\n".join(f"- {issue}" for issue in issues)
                  + "\nUse allow_large_changes only after reviewing the upstream changes."
              )

          if issues and allow:
              print("WARNING: Manual override accepted the following safety issues:")
              for issue in issues:
                  print(f"- {issue}")
          PY

