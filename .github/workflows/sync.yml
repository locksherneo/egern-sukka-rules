      # ==========================================================
      # 20. 最终检查
      # ==========================================================

      - name: Final validation
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          DOMAIN=$(
            find domain \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          NON_IP=$(
            find non_ip \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          IP=$(
            find ip \
              -type f \
              -name "*.yaml" \
              | wc -l
          )

          TOTAL=$(
            (
              DOMAIN
              + NON_IP
              + IP
            )
          )

          echo ""
          echo "===================================="
          echo " Final Repository Validation"
          echo "===================================="
          echo " domain : ${DOMAIN}"
          echo " non_ip : ${NON_IP}"
          echo " ip     : ${IP}"
          echo "------------------------------------"
          echo " TOTAL  : ${TOTAL}"
          echo "===================================="

          if [ "${TOTAL}" \
            -lt "${MIN_TOTAL_RULES}" ]; then

            echo "ERROR:"
            echo "Final rule count is too low."

            exit 1
          fi

          if [ ! -s RULES_SHA256SUMS.txt ]; then
            echo "ERROR: Missing RULES_SHA256SUMS.txt"
            exit 1
          fi

          if [ ! -s RULES_VERSION.sha256 ]; then
            echo "ERROR: Missing RULES_VERSION.sha256"
            exit 1
          fi


      # ==========================================================
      # 21. Commit
      # ==========================================================

      - name: Commit changes
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git add -A

          if git diff \
            --cached \
            --quiet; then

            echo "No effective changes."

            exit 0
          fi

          git commit \
            -m "chore: sync Sukka List rules for Egern"

          git push


